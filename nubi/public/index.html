<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nubi · Explorador de anúncios</title>
<!-- app no celular: Safari → Compartilhar → Adicionar à Tela de Início -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nubi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231F3864'/><path d='M8 22V10l8 8 8-8v12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1c2230; --muted:#667085; --line:#e4e7ec; --soft:#f0f2f5;
  --brand:#1F3864; --brand-ink:#ffffff; --accent:#2563eb; --good:#16794c; --good-bg:#e5f5ec;
  --bad:#b42318; --bad-bg:#fdecea; --warn:#9a6700; --warn-bg:#fff5d6; --focus:#93b4f5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --card:#171d27; --ink:#e6e9ef; --muted:#98a2b3; --line:#2a3342; --soft:#1e2531;
    --brand:#3b5b99; --accent:#6b9cff; --good:#4fc987; --good-bg:#153526; --bad:#ff7a6e; --bad-bg:#3a1a18;
    --warn:#f2c14e; --warn-bg:#3a3014; --focus:#3b5b99; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --card:#171d27; --ink:#e6e9ef; --muted:#98a2b3; --line:#2a3342; --soft:#1e2531;
  --brand:#3b5b99; --accent:#6b9cff; --good:#4fc987; --good-bg:#153526; --bad:#ff7a6e; --bad-bg:#3a1a18;
  --warn:#f2c14e; --warn-bg:#3a3014; --focus:#3b5b99; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
header.top .logo{font-weight:700;font-size:16px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;cursor:pointer}
header.top .logo small{font-weight:500;opacity:.8}
header.top .sp{flex:1}
header.top select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;max-width:240px}
header.top select option{color:#000}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
main{margin:0 auto;padding:20px clamp(16px,1.6vw,40px)}
/* Telas grandes (2K/4K): usa a largura toda e aumenta tudo na mesma proporção. */
@media (min-width:2200px){body{zoom:1.2}}
@media (min-width:2800px){body{zoom:1.4}}
@media (min-width:3400px){body{zoom:1.6}}
@media (min-width:1800px){.grid2{grid-template-columns:1.25fr 1fr}.tw{max-height:74vh}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)}
.alerta{color:var(--bad);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px;margin:14px 0}
.kpi{padding:12px}
.rk-plano{border-left:4px solid var(--accent)}.rk-form{display:grid;gap:8px}.rk-form textarea,.rk-form input,.rk-form select{width:100%;box-sizing:border-box}
.rk-lista{display:grid;gap:6px;margin-top:10px}.rk-it{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.rk-it summary{cursor:pointer;font-size:13px;overflow-wrap:anywhere}
.rk-corpo{margin-top:8px;font-size:13px}.rk-com{font-size:12.5px;border-left:2px solid var(--line);padding:2px 8px;margin-top:6px;overflow-wrap:anywhere}
.rk-acoes{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.rk-acoes input{flex:1;min-width:160px}
.po-lojas{display:grid;gap:6px}.po-loja{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.po-loja .muted{flex:1;min-width:0;font-size:12.5px;overflow-wrap:anywhere}
.po-lista{display:grid;gap:10px}.po-an{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.po-an img,.po-sem-foto{width:56px;height:56px;object-fit:contain;border-radius:8px;background:var(--soft);display:grid;place-items:center}
.po-tit{font-weight:600;font-size:13px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.po-termo{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.po-termo input{flex:1;min-width:0;padding:4px 8px;font-size:12.5px}.po-pos{text-align:right;font-size:13px;white-space:nowrap}.po-serie{font-size:11px;color:var(--muted)}
@media (max-width:600px){.po-an{grid-template-columns:48px minmax(0,1fr)}.po-pos{grid-column:2;text-align:left}}
.pi-pares{display:grid;gap:8px;margin-top:10px}.pi-par{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
.pi-par-t{flex:1 1 280px;min-width:0;overflow-wrap:anywhere}.pi-par-b{display:flex;gap:6px}
.kpi-link{cursor:pointer;transition:transform .12s,box-shadow .12s}.kpi-link:hover,.kpi-link:focus-visible{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.08);outline:none}
.kpi-link .l::after{content:" ›";color:var(--muted)}
.kpi .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .o{font-size:11.5px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.grid2>*{min-width:0}
.rolar{overflow-x:auto}
.grid2.gh{grid-template-columns:1fr 1fr}
@media (max-width:700px){.grid2.gh{grid-template-columns:1fr}}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 0;padding-bottom:0}
.tab{padding:9px 13px;border:none;background:none;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}
.tab .n{font-size:11px;background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:5px;color:var(--muted)}
.tab .n.warn{background:var(--warn-bg);color:var(--warn)}
.painel{margin-top:14px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:220px}
.tw{overflow:auto;max-height:70vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.t th{position:sticky;top:0;background:var(--brand);color:#fff;font-weight:600;font-size:12px;text-align:left;padding:8px 10px;white-space:nowrap;cursor:pointer;z-index:2;vertical-align:bottom}
table.t th.num{text-align:right}
table.t th .ar{opacity:.8;margin-left:3px}
table.t tr.f th{background:var(--soft);padding:4px 6px;cursor:default;top:33px}
table.t tr.f select,table.t tr.f input{width:100%;min-width:70px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 5px;font-size:12px;font-weight:400}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.num{text-align:right}
table.t td.wrap{white-space:normal;min-width:260px}
table.t tr:hover td{background:var(--soft)}
table.t td.first{font-weight:500}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)}
.mn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mn-maq.fora{opacity:.75}
.mn-med{margin:6px 0}.mn-med-cab{display:flex;justify-content:space-between;font-size:13px}.mn-med-cab b.good{color:var(--good)}.mn-med-cab b.warn{color:var(--warn,#b45309)}.mn-med-cab b.bad{color:var(--bad)}
.mn-barra{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0}.mn-barra i{display:block;height:100%;background:var(--good);border-radius:4px}.mn-barra i.warn{background:var(--warn,#b45309)}.mn-barra i.bad{background:var(--bad)}
.mn-med .spark{display:block;margin-top:2px}

.pill.warn{background:var(--warn-bg);color:var(--warn)}
.sinal{display:inline-block;border-radius:6px;padding:0 6px;margin:1px 3px 1px 0;font-size:11.5px;background:var(--soft)}
.sinal.good{background:var(--good-bg);color:var(--good)}
.sinal.bad{background:var(--bad-bg);color:var(--bad)}
.nota{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}
.more{padding:10px;text-align:center}
.login{max-width:420px;margin:12vh auto;padding:28px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--bg)}
.log{background:var(--soft);border-radius:8px;padding:10px 12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;
  padding:clamp(12px,3dvh,32px) 16px calc(clamp(12px,3dvh,32px) + env(safe-area-inset-bottom,0px));overflow:auto}
.modal{max-width:640px;width:100%;padding:18px;max-height:calc(100vh - (clamp(24px,6vh,64px) + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px)));
  max-height:calc(100dvh - (clamp(24px,6dvh,64px) + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px)));
  overflow:auto;overscroll-behavior:contain}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:600px){.form-row{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f input,label.f select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
.drop{display:block;margin-top:12px;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--soft)}
.prog{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .6s}
.barra{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;position:relative}
.barra::after{content:"";position:absolute;inset:0;width:35%;border-radius:3px;background:var(--accent);animation:barra 1.1s ease-in-out infinite}
@keyframes barra{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
.files .fi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.bcard{padding:16px;cursor:pointer;transition:border-color .15s}
.bcard:hover{border-color:var(--accent)}
.bcard .nm{font-weight:700;font-size:16px;padding-right:30px}
.bcard{position:relative}
.bdel{position:absolute;top:10px;right:10px;border:1px solid transparent;background:none;border-radius:8px;padding:3px 7px;font-size:14px;opacity:.35;cursor:pointer}
.bcard:hover .bdel{opacity:.8} .bdel:hover{opacity:1!important;border-color:var(--bad);background:var(--bad-bg)}
.multi{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.multi label{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--ink)} .multi label.muted b{font-weight:500}
.multi small{color:var(--muted)}
.bcard .mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:12.5px}
.bcard .mini b{display:block;font-size:15px}
.cfg-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px}
.cfg-row input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
svg.spark{display:block}
.top5 li{margin:6px 0}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 54px)}
.layout>main{margin:0;min-width:0}
aside.side{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.navi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;margin-bottom:4px}
.navi:hover{background:var(--soft)}
.navi.on{background:var(--soft);color:var(--accent)}
.navi .ic{font-size:18px;line-height:1.2}
.navi small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.subnav{display:flex;flex-direction:column;margin:0 0 8px 40px;border-left:1px solid var(--line)}
.subnav a{padding:5px 10px;color:var(--muted);text-decoration:none;font-size:13px}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:var(--accent);font-weight:600;border-left:2px solid var(--accent);margin-left:-1px}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside.side{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:none;border-bottom:1px solid var(--line)}.subnav{display:none}}
a.plink{color:inherit;text-decoration:none;border-bottom:1px dashed var(--muted);cursor:pointer}
a.plink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.modal.larga{max-width:1080px}
.modal.larga.pq{max-width:min(1440px,100%)}
.modal-bg:has(> .modal.pq){align-items:flex-start}  /* 02/10 (Bruno: "cortando lá em cima"): centralizado, o quadro alto perdia o topo */
.pq-sec{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 0}
.pq .kpis.pq-kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin:6px 0 0}
.pq .kpi .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq .kpi .o{-webkit-line-clamp:4}
.pq-det{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.pq tr.pq-eu td{background:var(--info-bg);font-weight:600}
/* ---- Mercado Livre (API oficial, 29/09): cabeçalho do anúncio, nota, perfil da loja e grade de produtos (visual do HunterHub) ---- */
.ml-cab{display:flex;gap:16px;align-items:flex-start}
.ml-cab .ml-foto{width:104px;height:104px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line);flex:none}
.ml-tit{font-size:17px;font-weight:700;color:var(--ink);text-decoration:none;line-height:1.3}
.ml-tit:hover{color:var(--accent)}
.ml-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ml-chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card);white-space:nowrap}
.ml-chip.cl{background:var(--soft);font-weight:600}.ml-chip.fg{color:#00a650;border-color:rgba(0,166,80,.4)}
.ml-chip.full{color:#00a650;font-weight:700}.ml-chip.velho{color:#e8590c;border-color:rgba(232,89,12,.4)}.ml-chip.neg{color:#d9480f}
.ml-linha{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-width:0}
.ml-preco{font-size:26px;font-weight:800;color:#00a650;font-variant-numeric:tabular-nums;white-space:nowrap}
.ml-preco.peq{font-size:17px}
.ml-cheio{color:var(--muted);text-decoration:line-through;font-size:14px;white-space:nowrap}
.ml-off{color:#fff;background:#f23d4f;border-radius:10px;font-size:12px;padding:2px 8px;font-weight:700;white-space:nowrap}
.ml-sep{width:2px;height:22px;background:#e8a33d;border-radius:1px}
.ml-loja{font-weight:700;color:var(--ink);text-decoration:none}.ml-loja:hover{color:var(--accent)}
.ml-term{display:inline-flex;gap:2px;vertical-align:middle;margin:0 4px}
.ml-term i{width:12px;height:7px;border-radius:2px;display:inline-block;opacity:.22}
.ml-term i.on{opacity:1}
.ml-term .s1{background:#f23d4f}.ml-term .s2{background:#ff7733}.ml-term .s3{background:#ffd400}.ml-term .s4{background:#aadb1e}.ml-term .s5{background:#00a650}
.ml-rep{display:inline-flex;gap:4px;vertical-align:middle}.ml-rep i{width:22px;height:9px;border-radius:3px;background:var(--soft);display:inline-block}
.ml-rep i.on{background:#00c16e}
.ml-topo{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.btn.ml-laranja{background:#f5610b;border-color:#f5610b;color:#fff;font-weight:700}.btn.ml-laranja:hover{filter:brightness(1.05)}
.ml-score{display:grid;grid-template-columns:230px 1fr;gap:28px;margin-top:14px}
.ml-nota{font-size:58px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.ml-nota small{font-size:18px;color:var(--muted);font-weight:500}
.ml-barra{height:7px;border-radius:4px;background:linear-gradient(90deg,#f28b82,#f6d365 50%,#7bd88f);position:relative;margin:16px 0 6px}
.ml-barra i{position:absolute;top:-5px;width:3px;height:17px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.ml-escala{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.ml-escala b{color:var(--ink)}
.ml-pts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px;font-size:14px}
.ml-pts li{display:grid;grid-template-columns:20px 1fr;gap:6px}.ml-pts small{display:block;color:var(--muted);margin-top:2px}
.ml-pts .ok{color:#12b76a}.ml-pts .alerta{color:#f04438}.ml-pts .neutro{color:var(--muted)}
.ml-perfil{display:flex;gap:16px;align-items:flex-start}
.ml-av{width:62px;height:62px;border-radius:50%;background:#fde9dd;color:#f5610b;display:grid;place-items:center;font-size:26px;font-weight:700;flex:none}
.ml-medalha{display:inline-block;background:#667085;color:#fff;border-radius:999px;font-size:12px;padding:2px 10px;font-weight:700;margin-top:4px}
.ml-medalha.Gold{background:#c69214}.ml-medalha.Silver{background:#98a2b3}
.ml-dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px;margin-top:16px;max-width:560px}

/* ===== Ajustes de layout (auditoria de UX, set/2026) ===== */
:root{--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--r-sm:6px;--r:8px;--fs-sm:12.5px;--fs-kpi:21px;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--info:#8fb3ff;--info-bg:#1a2640;--th-leve:#1e2531}}

.card{min-width:0}
h2{font-size:15px;font-weight:650}
/* KPIs: 4 por linha (8 = 4×2, sem sobrar um sozinho) */
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp3);margin:var(--sp4) 0}
.kpis:has(> :nth-child(5):last-child){grid-template-columns:repeat(5,minmax(0,1fr))}

@media (max-width:700px){.kpis,.kpis:has(> *){grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:var(--sp2)}

.aviso.warn{color:var(--warn);background:var(--warn-bg)} .aviso.warn::before{content:"!";background:var(--warn);font-family:inherit}

// 30/09 (413 no CSV de 4,7 MB): CSV acima de 3 MB vai compactado (gzip) com o cabeçalho X-Nubi-Gzip; o servidor volta ao original
async function corpoCsv(f) {
  const bruto = await f.arrayBuffer();
  if (bruto.byteLength < 3 * 1024 * 1024 || typeof CompressionStream === "undefined") return {body: bruto, headers: {"Content-Type": "text/csv"}};
  try {
    const comp = await new Response(new Blob([bruto]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    return {body: comp, headers: {"Content-Type": "application/octet-stream", "X-Nubi-Gzip": "1"}};
  } catch { return {body: bruto, headers: {"Content-Type": "text/csv"}}; }
}
async function api(rota, params = {}, opts = {}) {
  const {data} = await sb.auth.getSession();
  const token = data.session?.access_token;
  const q = new URLSearchParams({r: rota, ...params});
  const res = await fetch("/api/app?" + q, {method: opts.method || "GET", body: opts.body,
    headers: {Authorization: "Bearer " + token, ...(opts.headers || {})}});
  if (opts.blob && res.ok) return res.blob();
  let j; try { j = await res.json(); } catch { j = {erro: "Resposta inválida do servidor (" + res.status + ")."}; }
  if (!res.ok || j.erro) {
    if (res.status === 401) { S.msgLogin = j.erro; await sb.auth.signOut(); }
    const e = new Error(j.erro || "Erro " + res.status); e.status = res.status; throw e;
  }
  return j;
}

  $("#app").innerHTML = `

  $("#fl").onsubmit = async e => {

  };

    $("#lm").className = "muted"; $("#lm").innerHTML = '<span class="spin"></span> Enviando…';
    const {error} = await sb.auth.signInWithOtp({email, options: {emailRedirectTo: location.origin, shouldCreateUser: false}});

const TEMPO = {0: ["☀️", "céu limpo"], 1: ["🌤️", "poucas nuvens"], 2: ["⛅", "parcialmente nublado"], 3: ["☁️", "nublado"], 45: ["🌫️", "neblina"], 48: ["🌫️", "neblina"],
  51: ["🌦️", "garoa"], 53: ["🌦️", "garoa"], 55: ["🌦️", "garoa"], 61: ["🌧️", "chuva fraca"], 63: ["🌧️", "chuva"], 65: ["🌧️", "chuva forte"],
  71: ["🌨️", "neve"], 80: ["🌦️", "pancadas"], 81: ["🌧️", "pancadas"], 82: ["⛈️", "pancadas fortes"], 95: ["⛈️", "trovoadas"], 96: ["⛈️", "trovoadas"], 99: ["⛈️", "trovoadas"]};
const tempoDe = c => TEMPO[c] || TEMPO[Math.floor(c / 10) * 10] || ["🌡️", ""];
function datasVendas(hoje) {
  // datas que mexem com perfume no Brasil e nos marketplaces (as móveis são calculadas)
  const y = hoje.getFullYear(), d = (a, m, dia) => new Date(a, m - 1, dia);
  const nDom = (a, m, n) => { const x = d(a, m, 1); x.setDate(1 + (7 - x.getDay()) % 7 + 7 * (n - 1)); return x; };
  const ultSex = (a, m) => { const x = d(a, m + 1, 0); x.setDate(x.getDate() - (x.getDay() + 2) % 7); return x; };
  const pascoa = a => { const f = Math.floor, g = a % 19, c = f(a / 100), h = (c - f(c / 4) - f((8 * c + 13) / 25) + 19 * g + 15) % 30,
    i = h - f(h / 28) * (1 - f(29 / (h + 1)) * f((21 - g) / 11)), j = (a + f(a / 4) + i + 2 - c + f(c / 4)) % 7, l = i - j,
    m = 3 + f((l + 40) / 44); return d(a, m, l + 28 - 31 * f(m / 4)); };
  const lista = [];
  for (const a of [y, y + 1]) {
    const bf = ultSex(a, 11), cm = new Date(bf); cm.setDate(bf.getDate() + 3);
    lista.push(["Dia da Mulher", d(a, 3, 8)], ["Dia do Consumidor", d(a, 3, 15)], ["Páscoa", pascoa(a)], ["Dia das Mães", nDom(a, 5, 2)],
      ["Dia dos Namorados", d(a, 6, 12)], ["Dia dos Pais", nDom(a, 8, 2)], ["9.9", d(a, 9, 9)], ["Dia do Cliente", d(a, 9, 15)],
      ["10.10", d(a, 10, 10)], ["Dia das Crianças", d(a, 10, 12)], ["11.11", d(a, 11, 11)], ["Black Friday", bf], ["Cyber Monday", cm],
      ["12.12", d(a, 12, 12)], ["Natal", d(a, 12, 25)]);
  }
  const h0 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  return lista.map(([n, dt]) => ({n, dt, dias: Math.round((dt - h0) / 864e5)})).filter(x => x.dias >= 0).sort((a, b) => a.dias - b.dias).slice(0, 6);
}

      <div class="in-tempo-dias">${r.daily.time.map((t, i) => `<div><span class="muted">${i ? dsem[new Date(t + "T12:00").getDay()] : "hoje"}</span>
        <span>${tempoDe(r.daily.weather_code[i])[0]}</span><span>${Math.round(r.daily.temperature_2m_max[i])}° <span class="muted">${Math.round(r.daily.temperature_2m_min[i])}°</span></span>

  };
}

// Celular: toda tabela vira uma lista de cartões (rótulo da coluna ao lado de cada valor), sem rolagem para o lado.
function rotularTabelas(raiz) {
  (raiz || document).querySelectorAll("table.t:not([data-rot])").forEach(tb => {
    // 01/10 (Bruno: "todos os vendedores com o mesmo número de unidades"): tabela SEM cabeçalho usava a 1ª linha de dados
    // como rótulo de todos os cartões. Só o <thead> vira rótulo; sem ele, ficam os data-l que a própria tabela trouxer.
    const cab = tb.querySelector("thead tr:not(.f)");
    if (!cab) { tb.dataset.rot = 1; return; }
    const rot = [...cab.children].map(th => (th.innerText || th.textContent || "").replace(/[↑↓▲▼]/g, "").trim());
    tb.querySelectorAll("tbody tr").forEach(tr => [...tr.children].forEach((td, i) => { if (rot[i] && !td.dataset.l) td.dataset.l = rot[i]; }));
    tb.dataset.rot = 1;
  });
}

      if (v != null && (pontos || isolado)) svgEl("circle", {cx: X(i), cy: Y(v), r: 4, fill: s.cor, stroke: "var(--card)", "stroke-width": 2}, svg);

  });

    const exc = fins.length ? fins[fins.length - 1].y - (m.t + ih + 4) : 0;

    fins.forEach(f => { const t = svgTxt(svg, m.l + iw + 10, f.y + 4, f.s.nome.length > 17 ? f.s.nome.slice(0, 16) + "…" : f.s.nome, {class: "lbl"}); });

function mdSimples(t) {

    // links que o nubi põe nos tópicos da IA: vendedor (#/…), produto (vprod:chave) e marca (marca:nome)

async function verLogColetor(id) {

// Com o coletor rodando, busca o andamento a cada 4 s; parado, a cada 1 min.
async function cicloColetor() {

  if (S.sessao) {
    try { const cs = await api("coletor_status"); S.coletor = cs.execucoes; S.coletorPedido = cs.pedido; } catch { /* tenta de novo no próximo ciclo */ }
    desenharAgente();
    const card = $("#coletor-card");
    if (card && !document.querySelector(".modal-bg")) {
      const l = $("#coletor-log"), noFim = !l || l.scrollHeight - l.scrollTop - l.clientHeight < 30;
      const antes = S.coletorVivo;
      card.outerHTML = cartaoColetor();
      const n = $("#coletor-log");
      if (n) n.scrollTop = noFim ? n.scrollHeight : l.scrollTop;
      S.coletorVivo = (S.coletor || []).some(coletorRodando);
      if (antes && !S.coletorVivo) { toast("📥 Coletor terminou. Atualizando os vendedores…", 5000); S.vendLista = null; rotear(); }
    }
    S.coletorVivo = (S.coletor || []).some(coletorRodando);
  }
  S.coletorT = setTimeout(cicloColetor, S.coletorVivo ? 4000 : 60000);
}

// ---------- Comparar concorrentes (período escolhido x período anterior do mesmo tamanho) ----------
const CC_CORES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
// Matriz do celular (card #34): uma métrica por vez, coluna do vendedor fixa. Preço médio não existe nesta
// comparação (só o "Preço Médio" do export do Nubimetrics conta como preço, nunca vendas/unidades) e por isso
// sempre aparece "Sem dados" aqui, em vez de inventar um cálculo (ticket = vendas/unidades seria outra métrica).
const CC_METRICAS = [
  {k: "v", nome: "Vendas R$", valor: v => v.v, variacao: v => v.var_v, fmt: abrev},
  {k: "u", nome: "Unidades", valor: v => v.u, variacao: v => v.var_u, fmt: x => nf0.format(x)},
  {k: "pm", nome: "Preço médio", valor: () => null, variacao: () => null, fmt: x => "R$ " + nf2.format(x)},
  {k: "conv", nome: "Conversão", valor: v => v.conversao, variacao: v => v.var_conversao, fmt: x => nf2.format(x * 100) + "%"},
];
function donut(box, itens, fmt) {
  box.replaceChildren();
  const tot = itens.reduce((a, x) => a + x.v, 0) || 1, R = 70, r = 46, c = 90;
  const svg = svgEl("svg", {width: 180, height: 180, viewBox: "0 0 180 180"}, box);
  let a0 = -Math.PI / 2;
  itens.forEach(x => {
    const a1 = a0 + 2 * Math.PI * x.v / tot, grande = a1 - a0 > Math.PI ? 1 : 0;
    const p = (ang, rr) => `${c + rr * Math.cos(ang)},${c + rr * Math.sin(ang)}`;
    const d = x.v / tot >= 0.9999 ? `M${c},${c - R}A${R},${R} 0 1 1 ${c - 0.01},${c - R}L${c - 0.01},${c - r}A${r},${r} 0 1 0 ${c},${c - r}Z`
      : `M${p(a0, R)}A${R},${R} 0 ${grande} 1 ${p(a1, R)}L${p(a1, r)}A${r},${r} 0 ${grande} 0 ${p(a0, r)}Z`;
    const el = svgEl("path", {d, fill: x.cor, stroke: "var(--card)", "stroke-width": 1.5}, svg);
    el.addEventListener("pointermove", ev => mostrarTip(ev, x.nome, [{cor: x.cor, valor: FMT.pct(x.v / tot), nome: fmt(x.v)}]));
    el.addEventListener("pointerleave", esconderTip);
    a0 = a1;
  });
}

  catch (e) { main.innerHTML = `<h1>⚖️ Comparar concorrentes</h1><div class="card empty" style="margin-top:14px"><h2>Não foi possível carregar a comparação.</h2><button class="btn" id="cc-retry">Tentar novamente</button></div>`; $("#cc-retry").onclick = telaConcorrentes; desenharMenu(); return; }
  if (!r.tem) { main.innerHTML = `<h1>⚖️ Comparar concorrentes</h1><div class="card empty" style="margin-top:14px"><h2>Ainda sem vendas diárias</h2><p>Aparece quando o coletor trouxer as vendas de cada dia.</p></div>`; desenharMenu(); return; }

  const menos = (d, n) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() - n); return x.toISOString().slice(0, 10); };
  const u = r.ultimo, mesIni = u.slice(0, 8) + "01";
  const antFim = menos(mesIni, 1), antIni = antFim.slice(0, 8) + "01";
  const presets = [["Último dia", u, u], ["7 dias", menos(u, 6), u], ["15 dias", menos(u, 14), u], ["30 dias", menos(u, 29), u],
    ["Mês atual", mesIni, u], ["Mês anterior", antIni, antFim]];
  S.cc = S.cc || {med: "v", acum: false, sel: null, ord: "v", asc: false, busca: "", metrica: "v"};
  const st = S.cc;
  if (!st.metrica) st.metrica = "v";
  const vs = r.vendedores;
  if (!st.sel || !st.sel.every(n => vs.some(v => v.vendedor === n))) st.sel = vs.slice(0, 3).map(v => v.vendedor);
  const cor = n => CC_CORES[vs.findIndex(v => v.vendedor === n) % CC_CORES.length];

// 30/09 (Bruno: "meu estoque por categoria, igual ao ranking de marcas"): marca tirada do título, categoria do ranking
async function telaEstoqueCategorias() {
  const main = $("#main");
  main.innerHTML = `<div class="es-pg">${esAbas("categorias")}<div class="nload">${LOGO}<div class="nbarra"></div><div class="nmsg">Separando o estoque por categoria</div></div></div>`;
  let r;
  try { r = await api("estoque_categorias"); } catch (e) { main.innerHTML = `<div class="es-pg">${esAbas("categorias")}<div class="card empty">${esc(e.message)}</div></div>`; return; }

  S.ecat = r;
  const t = r.total, temV = !!r.vendas;
  const cor = c => COR_CAT[c] || "var(--dv-outro)";
  const cats = r.categorias.filter(c => c.skus);
  const barra = (xs, k, rot) => `<div class="ec-barra">${xs.filter(x => x[k] > 0).map(x => `<i style="width:${(100 * x[k]).toFixed(2)}%;background:${cor(x.categoria)}" title="${esc(x.categoria)} · ${FMT.pct(x[k])}"></i>`).join("")}</div><small class="muted">${rot}</small>`;
  const linhaResumo = (x, nome, ico, campo) => `<tr class="ec-clica" data-ec="${campo}" data-ev="${esc(nome)}" title="Ver os produtos"><td class="first">${ico || ""} <a>${esc(nome)}</a></td><td class="num">${nf0.format(x.skus)}</td><td class="num">${nf0.format(x.com_estoque)}</td>
    <td class="num ${x.zerados ? "neg" : ""}">${nf0.format(x.zerados)}</td><td class="num">${nf0.format(x.unidades)}</td><td class="num"><b>${rsES(x.valor)}</b></td><td class="num">${FMT.pct(x.pct_valor)}</td>
    ${temV ? `<td class="num">${nf0.format(x.vend_un)}</td><td class="num">${FMT.moeda(x.vend_valor)}</td><td class="num">${FMT.pct(x.pct_vendas)}</td><td class="num">${x.cobertura_dias == null ? "—" : nf0.format(x.cobertura_dias) + " d"}</td>` : ""}</tr>`;
  const cab = `<tr><th></th><th class="num">SKUs</th><th class="num">Com estoque</th><th class="num">Zerados</th><th class="num">Unidades</th><th class="num">Valor (custo)</th><th class="num">% do valor</th>
    ${temV ? `<th class="num">Vendas 30d (un.)</th><th class="num">Vendas 30d (R$)</th><th class="num">% das vendas</th><th class="num">Cobertura</th>` : ""}</tr>`;

    <div class="es-cab"><h1>🏷️ Estoque por categoria</h1><span class="muted">estoque de ${esc(quandoES(r.estoque_em))}${temV ? ` · vendas de ${nf0.format(r.vendas.dias || 30)} dias do UpSeller` : " · sem relatório de vendas"}</span></div>
    <p class="aviso">A marca vem do título do anúncio e a categoria é a mesma do Ranking de marcas (Designer, Nicho, Árabe…). Trocou a categoria de uma marca no Ranking → Categorias, muda aqui também.</p>
    ${(() => { const n = r.itens.filter(x => x.categoria === "Sem categoria" || x.categoria === "Outros" || !x.marca).length;
      return n ? `<div class="card pad" style="margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px"><b>❔ ${nf0.format(n)} produto(s) sem categoria, em Outros ou sem marca</b>
        <div class="muted" style="font-size:12px">O Astra lê o título (e o GTIN, quando há) de cada um, diz a marca e a categoria do produto (Skincare, Eletrônicos, Utilidades domésticas…) e cria categorias novas se precisar. O que ele não souber fica em Sem marca / Sem categoria para você completar. Não muda nada que você já escolheu.</div></div>

      <div class="l">${ICO_CAT[c.categoria] || ""} ${esc(c.categoria)}</div><div class="v">${abrev(c.valor)}</div>
      <div class="o"><b>${FMT.pct(c.pct_valor)}</b> do estoque · ${nf0.format(c.unidades)} un.${temV ? ` · vende ${FMT.pct(c.pct_vendas)}` : ""}</div></div>`).join("")}</div>
    <div class="card pad"><h2>Onde está o dinheiro × de onde vêm as vendas</h2>

  main.querySelectorAll(".ec-clica").forEach(el => el.onclick = () => abrirEcLista(el.dataset.ec, el.dataset.ev));

    [["marca", "Marca (clique)", "ecmarca", "txt"], ["categoria", "Categoria", "txt", "sel"], ["tipo", "Tipo", "txt", "sel"], ["skus", "SKUs", "int"], ["zerados", "Zerados", "int"],
     ["unidades", "Unidades", "int"], ["valor", "Valor (custo)", "moeda"], ["pct_valor", "% do valor", "pct"],
     ...(temV ? [["vend_un", "Vendas 30d (un.)", "int"], ["vend_valor", "Vendas 30d (R$)", "moeda"], ["pct_vendas", "% das vendas", "pct"], ["cob", "Cobertura (dias)", "int"]] : [])],

  desenharMenu();
}
// 30/09 (Bruno: "o botão ser clicável para ver a listagem dos produtos da categoria e poder editar a marca e a categoria"):
// a marca é de cada SKU (estoque_marca_salvar, vazia = volta ao título); a categoria é da MARCA (a mesma do Ranking de marcas).
function abrirEcLista(campo, valor) {
  const r = S.ecat; if (!r) return;
  const nomeCampo = {categoria: "Categoria", tipo: "Tipo", marca: "Marca"}[campo] || "";
  const marcaVal = x => x.marca || "(marca não identificada)";
  const filtro = x => (campo === "marca" ? marcaVal(x) : x[campo]) === valor;
  const itens = r.itens.filter(filtro);
  const nomesMarca = [...new Set(r.itens.map(x => x.marca).filter(Boolean))].sort();
  // 01/10 (Bruno): a categoria é do PRODUTO (faca = Utilidades domésticas, Fire Stick = Eletrônicos, sérum = Skincare);
  // a categoria da MARCA (Árabe, Designer…) continua valendo para perfume e body splash
  const catMarca = x => x.marca ? (((r.marcas || []).find(m => m.marca === x.marca) || {}).categoria || "") : "";
  const opcProd = x => `<select data-ecprod="${esc(x.sku)}" title="Categoria deste produto">
    <option value="">${x.categoria_fonte === "manual_sku" ? "↺ voltar à do título" : `${ICO_CAT[x.categoria] || ""} ${esc(x.categoria)}${x.categoria_fonte === "astra" ? " (Astra)" : ""}`}</option>
    ${[...new Set([...(r.opcoes_produto || []), ...r.opcoes, "Perfume", "Body splash"])].map(o => `<option ${x.categoria_fonte === "manual_sku" && o === x.categoria ? "selected" : ""} value="${esc(o)}">${ICO_CAT[o] || ""} ${esc(o)}</option>`).join("")}
    <option value="__nova">➕ nova categoria…</option></select>${x.categoria_fonte === "manual_sku" ? ` <small class="muted" title="Categoria escolhida por você">✎</small>` : x.categoria_fonte === "astra" ? ` <small class="muted" title="Lida pelo Astra">🤖</small>` : ""}`;
  // 01/10 (Bruno): marca sem categoria mostrava "Alta perfumaria" (1ª opção) por engano; agora "Sem categoria" vem selecionada.
  // E para produto que não é perfume/body splash (Fire Stick, tapete, home spray…) a categoria da marca não vale: mostra "—".
  const foraPerf = x => x && x.tipo && !["Perfume", "Body splash", "Outros"].includes(x.tipo);
  const opc = (atual, marca, x) => `<select data-eccat="${esc(marca)}" ${marca ? "" : "disabled title=\"Escolha a marca primeiro\""} ${foraPerf(x) ? `title="Vale para os perfumes e body splash da marca; este item é ${esc(x.tipo)} e fica na categoria dele"` : ""}>
    ${["Sem categoria", ...r.opcoes].map(o => `<option ${(o === "Sem categoria" ? !atual : o === atual) ? "selected" : ""} value="${o === "Sem categoria" ? "" : esc(o)}">${ICO_CAT[o] || ""} ${esc(o)}</option>`).join("")}</select>${foraPerf(x) ? ` <small class="muted" title="A categoria da marca não muda este item">só p/ perfumes</small>` : ""}`;
  // 01/10 (Bruno: "essa tela está horrível; o mais importante é o disponível e a frequência de vendas; traga o custo
  // médio"): o modo normal mostra só os números; marca e categoria se editam no modo "✎ Editar"
  const ed = !!S.ecEditar;
  const cobCls = d => d == null ? "" : d < 15 ? "neg" : d < 30 ? "warn-t" : "pos";
  // 01/10 (Bruno): linha pintada bem fraquinha — vermelho = urgência (< 15 dias ou zerado vendendo), amarelo = alerta (< 30),
  // verde = ok; sem venda em 30 dias fica sem cor
  const nivel = x => x.vend_un > 0 && (x.disponivel ?? x.atual) <= 0 ? "urg" : x.cobertura_dias == null ? "" :
    x.cobertura_dias < 15 ? "urg" : x.cobertura_dias < 30 ? "alerta" : "ok";
  const linhas = xs => xs.map(x => `<tr class="ec-${nivel(x)}" data-busca="${esc((x.sku + " " + x.titulo + " " + x.marca).toLowerCase())}">
    <td class="ec-prod"><b>${esc(x.sku)}</b><div class="muted">${esc(x.titulo)}</div>${!ed && x.marca ? `<span class="pill">${esc(x.marca)}</span>` : ""}</td>
    ${ed ? `<td><input list="ec-dl" class="ec-marca" data-sku="${esc(x.sku)}" value="${esc(x.marca)}" placeholder="marca…" style="width:150px">
      ${x.marca_manual ? `<small class="muted" title="Você escolheu esta marca">✎</small>` : ""}</td>
    <td>${opcProd(x)}</td>
    <td>${opc(catMarca(x), x.marca, x)}${x.categoria_fonte === "manual" ? ` <small class="muted" title="Categoria escolhida por você">✎</small>` : ""}</td>` : ""}
    <td class="num"><b class="${x.disponivel > 0 ? "" : "neg"}">${nf0.format(x.disponivel ?? x.atual)}</b></td>
    <td class="num">${x.transito ? `<b>${nf0.format(x.transito)}</b>` : `<span class="muted">—</span>`}</td>
    <td class="num">${x.custo != null ? rsES(x.custo) : "—"}</td>
    <td class="num">${x.preco_venda != null ? rsES(x.preco_venda) : `<span class="muted">—</span>`}</td>
    <td class="num">${nf0.format(x.vend_un)}</td>
    <td class="num"><b class="${cobCls(x.cobertura_dias)}">${x.cobertura_dias == null ? "—" : nf0.format(x.cobertura_dias) + " d"}</b></td></tr>`).join("");
  const tot = itens.reduce((a, x) => ({v: a.v + x.valor, u: a.u + (x.disponivel ?? x.atual), vu: a.vu + x.vend_un}), {v: 0, u: 0, vu: 0});
  const bg = modal(`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">${ICO_CAT[valor] || ""} ${esc(nomeCampo)}: ${esc(valor)}</h2>
      <span class="muted">${nf0.format(itens.length)} SKU(s) · ${nf0.format(tot.u)} un. disponíveis · ${rsES(tot.v)} em custo · vendeu ${nf0.format(tot.vu)} un. em 30 dias</span>
      <div style="flex:1"></div><button class="btn small ${ed ? "primary" : ""}" id="ec-editar">${ed ? "✓ Concluir edição" : "✎ Editar marca e categoria"}</button><button class="btn small" data-fechar>Fechar</button></div>
    ${ed ? `<p class="muted" style="margin:6px 0;font-size:12px">A <b>marca</b> é deste produto (apague para voltar à achada no título). A <b>categoria do produto</b> é deste item. A <b>categoria da marca</b> vale para os perfumes e body splash da marca inteira.</p>` : ""}
    <input type="search" id="ec-busca" placeholder="Buscar SKU, título ou marca…" style="width:100%;margin-bottom:6px">
    <datalist id="ec-dl">${nomesMarca.map(m => `<option value="${esc(m)}">`).join("")}</datalist>
    <div class="rolar" style="max-height:62vh"><table class="t"><thead><tr><th>Produto</th>${ed ? "<th>Marca</th><th>Categoria do produto</th><th>Categoria da marca</th>" : ""}
      <th class="num" title="O que dá para vender agora (UpSeller)">Disponível</th><th class="num" title="Compras a caminho (UpSeller: Em trânsito)">Em trânsito</th>
      <th class="num">Custo médio</th><th class="num" title="Preço médio das vendas dos últimos 30 dias (UpSeller, Vendas por Anúncio)">Preço de venda</th>
      <th class="num">Vendas 30d</th><th class="num" title="Disponível ÷ média de vendas por dia">Cobertura</th></tr></thead>
    <tbody>${linhas(itens.slice().sort((a, b) => (a.cobertura_dias ?? 1e9) - (b.cobertura_dias ?? 1e9) || b.vend_un - a.vend_un)) || `<tr><td colspan="9" class="muted">Nenhum produto.</td></tr>`}</tbody></table></div>`);
  bg.querySelector(".modal").classList.add("larga", "ec-modal");
  bg.querySelector("#ec-editar").onclick = () => { S.ecEditar = !S.ecEditar; bg.remove(); abrirEcLista(campo, valor); };
  bg.querySelector("#ec-busca").oninput = e => { const q = e.target.value.toLowerCase().trim();
    bg.querySelectorAll("tbody tr[data-busca]").forEach(tr => tr.style.display = !q || tr.dataset.busca.includes(q) ? "" : "none"); };
  const recarregar = async (msg) => {
    try { S.ecat = await api("estoque_categorias"); } catch (e) { toast(e.message); return; }
    toast(msg); bg.remove(); await telaEstoqueCategorias(); abrirEcLista(campo, valor);
  };
  bg.querySelectorAll(".ec-marca").forEach(inp => {
    const salvar = async () => {
      const antes = (r.itens.find(x => x.sku === inp.dataset.sku) || {}).marca || "";
      if (inp.value.trim() === antes) return;
      inp.disabled = true;
      try { await api("estoque_marca_salvar", {}, {method: "POST", body: JSON.stringify({sku: inp.dataset.sku, marca: inp.value.trim()})});
        await recarregar(inp.value.trim() ? `${inp.dataset.sku}: marca ${inp.value.trim()}` : `${inp.dataset.sku}: marca volta a ser a do título`);
      } catch (e) { toast(e.message); inp.disabled = false; }
    };
    inp.onchange = salvar; inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); };
  });
  bg.querySelectorAll("[data-ecprod]").forEach(sel => sel.onchange = async () => {
    let cat = sel.value;
    if (cat === "__nova") { cat = (prompt("Nome da nova categoria de produto (1 a 3 palavras):") || "").trim(); if (!cat) { sel.value = ""; return; } }
    sel.disabled = true;
    try { await api("estoque_categoria_sku_salvar", {}, {method: "POST", body: JSON.stringify({sku: sel.dataset.ecprod, categoria: cat})});
      await recarregar(cat ? `${sel.dataset.ecprod}: ${cat}` : `${sel.dataset.ecprod}: categoria automática`);
    } catch (e) { toast(e.message); sel.disabled = false; }
  });
  bg.querySelectorAll("[data-eccat]").forEach(sel => sel.onchange = async () => {
    const marca = sel.dataset.eccat, cat = sel.value;
    if (!confirm(`Mudar a categoria da marca ${marca} para ${cat || "automática"}?\n\nVale para todos os produtos dessa marca aqui e no Ranking de marcas.`)) { sel.value = sel.querySelector("[selected]")?.value ?? ""; return; }
    sel.disabled = true;
    try { await api("ranking_categoria_salvar", {}, {method: "POST", body: JSON.stringify({marca, categoria: cat})});
      await recarregar(`${marca}: ${cat || "categoria automática"}`);
    } catch (e) { toast(e.message); sel.disabled = false; }
  });
}
// ---------- Minhas Lojas → 📊 Análises de Vendas (01/10; nome como o menu Análises do UpSeller, Bruno: "crie um menu Minhas Vendas com os dados do UpSeller Vendas por
// Anúncio primeiro"). O coletor baixa o relatório de 30 dias junto do estoque; o servidor cruza com o estoque (só números).
const MV_MENU = [["hoje", "⚡ Vendas de hoje"], ["tv", "📺 Modo TV"], ["anuncio", "🧾 Vendas por Anúncio"], ["abc", "🔤 Curva ABC"], ["lucro", "💰 Lucro e ADS (Gestor)"], ["promocao", "🏷️ Para promoção"]];
// 01/10 (Bruno: "vendas ABC do UpSeller, separado"): a mesma conta da Análise ABC do UpSeller (A até 80% acumulado, B até
// 95%, C o resto), por valor ou por volume, feita com o relatório Vendas por Anúncio (conferida: 59/95/166 = 79,71/15,23/5,06%)
function telaCurvaABC(r) {
  const main = $("#main"), v = r.vendas || {};
  const f = S.abcF || (S.abcF = {por: "valor", classe: "", q: ""});
  const dia = x => x ? String(x).slice(8, 10) + "/" + String(x).slice(5, 7) : "";
  const est = {}; r.anuncios.forEach(a => est[a.sku + "|" + a.anuncio + "|" + a.loja] = a);
  const desenhar = () => {
    const c = r.abc[f.por], ehValor = f.por === "valor", fmt = x => ehValor ? rsES(x) : nf0.format(x) + " un.";
    const cor = {A: "#2563eb", B: "#d97706", C: "#dc2626"};
    const n = c.itens.length || 1, W = 1000, H = 100;
    const pts = c.itens.map((x, i) => [(i + 1) / n * W, H - x.acum]);
    const ixs = k => c.itens.map((x, i) => x.classe === k ? i : -1).filter(i => i >= 0);
    const area = k => { const ix = ixs(k); if (!ix.length) return "";
      const ini = ix[0] ? pts[ix[0] - 1] : [0, H], p = [ini, ...ix.map(i => pts[i])];
      const linha = p.map(q => q[0].toFixed(2) + "," + q[1].toFixed(2)).join(" ");
      return `<polygon points="${p[0][0].toFixed(2)},${H} ${linha} ${p[p.length - 1][0].toFixed(2)},${H}" fill="${cor[k]}" opacity=".12"></polygon>
        <polyline points="${linha}" fill="none" stroke="${cor[k]}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>`; };
    const corte = k => { const ix = ixs(k); return ix.length ? (ix[ix.length - 1] + 1) / n * 100 : null; };
    const marcas = ["A", "B"].map(k => { const x = corte(k); const cl = c.classes.find(z => z.classe === k);

// ---------- SAC → 📚 Base de conhecimento SAC (27/09, pedido do Bruno): uma base só para todas as lojas, com o ícone de onde
// veio cada pergunta (TikTok, Shopee, Mercado Livre ou digitada no nubi). As propostas dos chats só respondem depois de aprovadas.
async function telaBaseSac() {
  if (S.kbVista === "fichas") return telaFichas();
  const main = $("#main"), fo = S.kbOrigem || "";
  if (!S.kbCarregou) main.innerHTML = sacAbas("base") + `<div class="nload">${LOGO}<div class="nbarra"></div><div class="nmsg">Abrindo a base do SAC</div></div>`;

// ---------- Caixa de conhecimento: a memória que todos os agentes (e o programador automático) leem antes de trabalhar ----------
const CON_TIPOS = {briefing: "📌 Briefing", regra: "⚖️ Regra", procedimento: "🛠️ Procedimento", decisao: "✅ Decisão", aprendizado: "💡 Aprendizado", conversa: "💬 Conversa"};
// caixa de pacotes aprovados (card #28): o mesmo coletor/caixa.txt que o coletor usa para instalar (pip --require-hashes)
function caixaPacotes(txt) {
  return txt.split("\n").map(l => {
    const m = l.match(/^\s*(?:# ollama:\s*)?([A-Za-z0-9_.\-:]+)(?:==(\S+))?(?:\s+--hash=sha256:([0-9a-f]+))?\s*(?:#\s*(.*))?$/);
    if (!m || (l.trim().startsWith("#") && !/^\s*# ollama:/.test(l))) return null;
    const [onde, uso] = (m[4] || "").split(" · ");
    return {nome: m[1], versao: m[2] || "", hash: m[3] || "", onde: /# ollama:/.test(l) ? "Ollama (Mac)" : onde || "", uso: uso || ""};
  }).filter(Boolean);
}
function caixaHtml(txt) {
  const q = (S.conQ || "").toLowerCase(), itens = caixaPacotes(txt).filter(p => !q || (p.nome + " " + p.onde + " " + p.uso).toLowerCase().includes(q));
  if (!itens.length) return "";
  return `<details class="card pad" style="margin-top:10px"><summary><b>📦 Caixa de pacotes e bibliotecas</b> · ${itens.length} aprovados
      <span class="chip" style="background:var(--soft)">pacote novo exige aprovação do Bruno · risco alto</span></summary>
    <div class="muted" style="font-size:12px;margin:6px 0">o coletor instala só isto, da cópia local no Mac (wheelhouse), com o hash conferido · hash = sha256 da roda do Mac (arm64, Python 3.12)</div>
    ${itens.map(p => `<div style="padding:6px 0;border-top:1px solid var(--line,#eee)"><b>${esc(p.nome)}</b> ${esc(p.versao || "")}
      <span class="muted" style="font-size:12px"> · ${esc(p.onde || "não informado")}${p.uso ? " · " + esc(p.uso) : ""}</span>
      <div style="font-family:monospace;font-size:11px;word-break:break-all">${p.hash ? "sha256:" + esc(p.hash) : "hash: não informado"}</div></div>`).join("")}</details>`;
}
async function telaConhecimento() {
  const main = $("#main");
  main.innerHTML = opsAbas("conhecimento") + `<div class="nload">${LOGO}<div class="nbarra"></div><div class="nmsg">Abrindo a caixa de conhecimento</div></div>`;
  let r, caixa = "";
  try { [r, caixa] = await Promise.all([api("conhecimento", S.conQ ? {q: S.conQ} : {}), fetch("/coletor/caixa.txt").then(x => x.ok ? x.text() : "").catch(() => "")]); } catch (e) { main.innerHTML = opsAbas("conhecimento") + `<div class="card empty">${esc(e.message)}</div>`; return; }
  if (!location.hash.startsWith("#/central/conhecimento")) return;
  main.innerHTML = opsAbas("conhecimento") + `<div class="es-cab"><h1>📚 Caixa de conhecimento</h1>
      <span class="muted">o que os agentes leem antes de trabalhar · o Hermes documenta as conversas aqui</span>
      <div class="acoes"><button class="btn small primary" id="con-novo">+ Adicionar</button></div></div>
    <div class="es-filtros"><input type="search" id="con-q" placeholder="Buscar no conhecimento…" value="${esc(S.conQ || "")}"></div>
    ${caixaHtml(caixa)}
    ${r.itens.length ? r.itens.map(c => `<details class="card pad con-it" style="margin-top:10px" ${c.fixo ? "open" : ""}><summary><b>${esc(CON_TIPOS[c.tipo] || c.tipo)}</b> · ${esc(c.titulo)}
        ${c.fixo ? `<span class="chip" style="background:var(--soft)">sempre lido</span>` : ""}<span class="muted" style="font-size:12px"> · ${esc(c.autor || "")} · ${esc(desde(c.atualizado_em))}</span></summary>
        ${mdCodigo(c.texto)}<div class="muted" style="font-size:12px;margin-top:6px">${c.fonte ? "fonte: " + esc(c.fonte) + " · " : ""}<a href="#" data-con-ed="${c.id}">editar</a></div></details>`).join("")
      : `<div class="card empty"><p>Nada encontrado.</p></div>`}`;
  const ed = c => {
    const titulo = prompt("Título:", c?.titulo || ""); if (!titulo) return;
    const texto = prompt("Texto (pode colar vários parágrafos):", c?.texto || ""); if (!texto) return;
    const tipo = prompt("Tipo (" + Object.keys(CON_TIPOS).join(", ") + "):", c?.tipo || "aprendizado") || "aprendizado";
    api("conhecimento_salvar", {}, {method: "POST", body: JSON.stringify({id: c?.id, titulo, texto, tipo})}).then(() => telaConhecimento()).catch(e => toast(e.message, 6000));
  };
  $("#con-novo").onclick = () => ed(null);
  main.querySelectorAll("[data-con-ed]").forEach(a => a.onclick = e => { e.preventDefault(); ed(r.itens.find(x => x.id === +a.dataset.conEd)); });
  let tq; $("#con-q").oninput = e => { clearTimeout(tq); tq = setTimeout(() => { S.conQ = e.target.value.trim(); telaConhecimento().then(() => { const i = $("#con-q"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }, 400); };
  desenharMenu();
}
// ---------- Agentes: status, custo (tokens × preço), teste de versão e apelido ----------

const nfmt = n => (+n || 0).toLocaleString("pt-BR");
const usd = v => "US$ " + (+v || 0).toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: v && v < 0.01 ? 4 : 2});

      <span class="st ${st[0]} ${a.status === "executando" ? "ag-pulso" : ""}">${st[1]}</span></div>
    <p class="ag-papel">${esc(a.papel || "")}</p>
    ${a.perfil && a.perfil.jeito ? `<p class="ag-jeito">${esc(a.perfil.jeito)}</p>` : ""}
    ${a.perfil ? `<details class="ag-perfil"><summary>📋 Perfil completo: função, modelo, o que pode e o que não pode</summary>
      <div class="ag-m"><span class="l">Função</span>${esc(a.perfil.funcao)}</div>
      <div class="ag-m"><span class="l">Modelo</span>${esc(a.perfil.modelo)}</div>

      <div class="ag-m"><span class="l">✅ Pode</span><ul>${a.perfil.pode.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="ag-m"><span class="l">⛔ Não pode</span><ul>${a.perfil.nao_pode.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    </details>` : ""}
    ${a.limites ? `<div class="ag-m"><span class="l">Gasto de hoje</span><b>${usd(a.limites.gasto_hoje)}</b> de ${usd(a.limites.teto_dia)} por dia
      · teto ${usd(a.limites.teto_pesquisa)} por pesquisa${a.limites.rodando ? ` · ${a.limites.rodando} rodando` : ""}${a.limites.fila ? ` · ${a.limites.fila} na fila` : ""}</div>
      <div class="ag-m"><span class="l">Últimas pesquisas</span>${a.limites.ultimas.length ? `<ul>${a.limites.ultimas.map(x => `<li>${esc((x.pergunta || "").slice(0, 110))}
        <span class="muted">· ${esc({pedida: "na fila", rodando: "rodando", feita: "pronta", erro: "erro"}[x.status] || x.status || "")}${x.custo_usd != null ? " · " + usd(x.custo_usd) : ""}</span></li>`).join("")}</ul>`
        : `<span class="muted">nenhuma ainda — peça na Sala com /pesquisar pergunta</span>`}</div>` : ""}
    ${a.internet_hoje ? `<div class="ag-m"><span class="l">Internet hoje</span>${nfmt(a.internet_hoje)} de ${nfmt(a.internet_limite)} pesquisas</div>` : ""}

        <button class="btn small" data-pedir="${esc(a.id)}">🎲 Deixar escolher apelido</button>` :
        `<span class="muted" style="font-size:12px">${a.id === "hermes" ? "Testa no Mac: <code>~/.nubi-coletor/coletor hermes</code> (e escolhe o apelido na primeira vez)"

      <button class="btn small" data-apelido="${esc(a.id)}">✏️ Apelido</button></div>
  </div>`;
}

      <tbody>${r.precos.map(p => `<tr><td class="first"><code>${esc(p.modelo)}</code></td>
        <td><input class="mes" style="width:80px" data-pe="${esc(p.modelo)}" value="${p.entrada ?? ""}" inputmode="decimal"></td>
        <td><input class="mes" style="width:80px" data-ps="${esc(p.modelo)}" value="${p.saida ?? ""}" inputmode="decimal"></td>
        <td class="wrap muted">${esc(p.obs || "")}</td><td><button class="btn small" data-psalvar="${esc(p.modelo)}">Salvar</button></td></tr>`).join("")}
        <tr><td><input class="mes" id="pn-m" placeholder="novo modelo" style="width:150px"></td><td><input class="mes" id="pn-e" style="width:80px"></td>
          <td><input class="mes" id="pn-s" style="width:80px"></td><td></td><td><button class="btn small" id="pn-add">Adicionar</button></td></tr></tbody></table></div></div>`;
  $("#ag-periodo").onchange = e => { location.hash = "#/central/agentes?periodo=" + e.target.value; };
  main.querySelectorAll("[data-testar]").forEach(b => b.onclick = async () => {
    const c = carregando("Testando o agente");

      x.ok ? c.ok(`Funcionando${x.modelo_api ? " · " + x.modelo_api : ""}`, 2500) : c.erro(x.erro || "Sem resposta"); telaAgentes(true); }
    catch (e) { c.erro(e.message); }
  });
  main.querySelectorAll("[data-pedir]").forEach(b => b.onclick = async () => {
    const c = carregando("O agente está escolhendo o apelido");
    try { const x = await api("agentes_apelido", {}, {method: "POST", body: JSON.stringify({id: b.dataset.pedir, pedir: true})}); c.ok("Apelido: " + x.apelido, 2500); telaAgentes(true); }
    catch (e) { c.erro(e.message); }
  });
  main.querySelectorAll("[data-apelido]").forEach(b => b.onclick = async () => {

    catch (e) { toast(e.message, 6000); }

  });

// Cabeçalho comum das telas de um vendedor, com as abas Ano / Mês / Alertas.
function cabVendedor(nomeV, aba, extra = "", nAlertas) {
  const base = "#/vendedores/" + encodeURIComponent(nomeV);
  const lista = (S.vendLista || []).find(v => v.vendedor === nomeV);
  const ultMes = lista ? ((lista.meses.find(m => !m.ate) || lista.meses[0] || {}).mes || "") : "";
  return `<div class="vcab">
      <h1>🏪 ${esc(nomeV)}</h1>
      <nav class="vabas">
        <a class="${aba === "ano" ? "on" : ""}" href="${base}">📈 Visão do ano</a>
        <a class="${aba === "mes" ? "on" : ""}" href="${base}/${ultMes}">📅 Mês a mês</a>
        <a class="${aba === "alertas" ? "on" : ""}" href="${base}/alertas">🚨 Alertas de estoque${nAlertas ? ` <span class="n bad">${nAlertas}</span>` : ""}</a>
        <a class="${aba === "explorador" ? "on" : ""}" href="${base}/explorador" title="O que ele vende nos exports do Explorador de anúncios (todas as marcas), com o produto clicável">🔭 Explorador</a>
      </nav>${extra}</div>`;
}

      <div class="rolar"><table class="t" style="font-size:12.5px"><thead><tr><th>Vendedor</th><th>Hoje</th><th class="num">Ritmo no último mês</th><th class="num">Mês anterior</th><th>Unidades mês a mês</th><th class="num">Vendas no período</th></tr></thead>

// Lista de marcas em "sinais": mostra as 8 maiores e o resto num modal.
function resumoSinais(xs, cls, f, titulo, n = 8) {
  const id = "rs" + Math.random().toString(36).slice(2, 8);
  (S.resumos ||= {})[id] = {xs, cls, f, titulo};
  return xs.slice(0, n).map(m => `<span class="sinal ${cls}">${f(m)}</span>`).join("")
    + (xs.length > n ? ` <a href="#" onclick="event.preventDefault();verResumo('${id}')">+${xs.length - n} outras</a>` : "");
}
function verResumo(id) {
  const {xs, cls, f, titulo} = S.resumos[id];
  modal(`<h2>${esc(titulo)} (${xs.length})</h2><div>${xs.map(m => `<span class="sinal ${cls}">${f(m)}</span>`).join("")}</div>
    <div style="text-align:right;margin-top:14px"><button class="btn" data-fechar>Fechar</button></div>`);
}

    <p class="muted" style="margin-top:0">O export de anúncios de um vendedor que você segue no Nubimetrics (.xlsx). O nome do arquivo vira o nome do vendedor — use o mesmo nome de sempre para o histórico juntar os meses.</p>
    <label class="drop" id="dz"><input type="file" id="fi" accept=".xlsx,.csv" multiple hidden>Clique ou arraste os arquivos aqui</label>
    <datalist id="vconh">${conhecidos.map(v => `<option value="${esc(v)}">`).join("")}</datalist>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" data-fechar id="fcan">Cancelar</button><button class="btn primary" id="fgo" disabled>Importar</button></div>`,
    m => {
      const dz = $("#dz", m), fi = $("#fi", m);
      let rodando = false, terminou = false;
      const desenhar = () => {
        $("#fl", m).innerHTML = itens.map((it, i) => `<div class="fi"><b>${esc(it.f.name)}</b>
          ${it.info ? `<span class="muted">${nf0.format(it.info.anuncios)} anúncios · ${abrev(it.info.vendas)} · ${nf0.format(it.info.marcas)} marcas</span>` : ""}
          ${it.estado === "ok" ? ' <span class="pill good">importado</span>' : it.estado === "erro" ? ' <span class="pill bad">não importado</span>' : ""}
          <div class="form-row" style="grid-template-columns:2fr 1fr">
            <label class="f">Vendedor<input list="vconh" data-i="${i}" data-k="vendedor" value="${esc(it.vendedor)}"></label>
            <label class="f">Mês fechado<input type="month" data-i="${i}" data-k="mes" value="${it.mes}"></label>
          </div>
          ${it.estado === "rodando" || it.estado === "lendo" ? `<div class="barra" style="margin-top:10px"></div>` : ""}
          ${it.log ? `<div class="log">${esc(it.log)}</div>` : ""}</div>`).join("");
        m.querySelectorAll("[data-k]").forEach(inp => { inp.disabled = rodando || itens[inp.dataset.i].estado === "ok";
          inp.oninput = () => { itens[inp.dataset.i][inp.dataset.k] = inp.dataset.k === "vendedor" ? inp.value.toUpperCase() : inp.value; }; });
        const go = $("#fgo", m);
        if (terminou) { go.disabled = false; go.textContent = "Concluído"; }
        else { go.disabled = rodando || !itens.some(it => it.estado !== "ok") || itens.some(it => it.estado === "lendo"); go.textContent = rodando ? "Importando…" : "Importar"; }
        $("#fcan", m).classList.toggle("hidden", rodando || terminou);
      };
      const add = async files => {
        for (const f of files) {
          const it = {f, vendedor: "", mes: mesAnterior(), estado: "lendo", log: ""};
          itens.push(it); terminou = false; desenhar();
          try { it.info = await api("vend_analisar", {arquivo: f.name}, {method: "POST", body: await f.arrayBuffer()});
            it.vendedor = it.info.vendedor; if (it.info.mes) it.mes = it.info.mes; it.estado = ""; }
          catch (e) { it.estado = "erro"; it.log = e.message; }
          desenhar();
        }
      };
      fi.onchange = () => { add([...fi.files]); fi.value = ""; };
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("on"); };
      dz.ondragleave = () => dz.classList.remove("on");
      dz.ondrop = e => { e.preventDefault(); dz.classList.remove("on"); add([...e.dataTransfer.files]); };
      $("#fgo", m).onclick = async () => {
        if (terminou) { m.remove(); return; }
        rodando = true; let ultimo = null;
        for (const it of itens.filter(x => x.estado !== "ok")) {
          if (!it.vendedor || !it.mes) { it.estado = "erro"; it.log = "Preencha o vendedor e o mês."; desenhar(); continue; }
          it.estado = "rodando"; it.log = ""; desenhar();
          try { const r = await api("vend_importar", {arquivo: it.f.name, vendedor: it.vendedor, mes: it.mes}, {method: "POST", body: await it.f.arrayBuffer()});
            it.log = r.log.join("\n"); it.estado = "ok"; ultimo = r; }
          catch (e) { it.estado = "erro"; it.log = e.message; }
          desenhar();
        }
        rodando = false; terminou = true; desenhar();
        await carregarVendLista();
        if (ultimo) location.hash = `#/vendedores/${encodeURIComponent(ultimo.vendedor)}`;   // abre no mês mais recente
        await rotear();
      };
    });
}

// Marca oficial (master): o nome para onde vão as outras grafias.
const master = m => `<span class="master" title="Marca oficial (master): as outras grafias viram esta">${esc(m)}<sup class="reg">R</sup></span>`;
// Onde a grafia aparece, sempre no último mês/período de cada fonte (não é soma de meses).
function infoMarca(inf) {
  if (!inf) return "";
  const l = [];
  if (inf.ranking) l.push(`🏆 #${inf.ranking.posicao} no ranking de ${mesCurto(inf.ranking.mes)} · ${abrev(inf.ranking.vendas)} no mês`);
  if (inf.vendedores) l.push(`🏪 ${inf.vendedores.vendedores} vendedor(es) monitorado(s) · ${abrev(inf.vendedores.vendas)} em ${mesCurto(inf.vendedores.mes)}`);
  if (inf.explorador) l.push(`🔎 Explorador ${dataBR(inf.explorador.mes).slice(0, 5)} a ${dataBR(inf.explorador.fim).slice(0, 5)}: ${inf.explorador.vendedores} vendedor(es) · ${abrev(inf.explorador.vendas)}`);
  return l.map(t => `<br><small class="muted">${esc(t)}</small>`).join("");
}

          ${it.estado === "rodando" || it.estado === "lendo" ? `<div class="barra" style="margin-top:10px"></div>` : ""}
          ${it.log ? `<div class="log">${esc(it.log)}</div>` : ""}</div>`).join("");
        m.querySelectorAll("[data-k]").forEach(inp => { inp.disabled = rodando || itens[inp.dataset.i].estado === "ok";
          inp.oninput = () => { itens[inp.dataset.i][inp.dataset.k] = inp.dataset.k === "categoria" ? inp.value.toUpperCase() : inp.value; }; });
        const go = $("#fgo", m);
        if (terminou) { go.disabled = false; go.textContent = "Concluído"; }
        else { go.disabled = rodando || !itens.some(it => it.estado !== "ok") || itens.some(it => it.estado === "lendo"); go.textContent = rodando ? "Importando…" : "Importar"; }
        $("#fcan", m).classList.toggle("hidden", rodando || terminou);
      };
      const add = async files => {
        for (const f of files) {
          const p = f.name.match(PADRAO_RK);
          const it = {f, categoria: p ? p[1].replace(/_/g, "-").replace(/-$/, "").toUpperCase() : "", mes: p ? p[2] : "", estado: "lendo", log: ""};
          itens.push(it); terminou = false; desenhar();
          try { it.info = await api("ranking_analisar", {arquivo: f.name}, {method: "POST", body: await f.arrayBuffer()});
            if (!it.categoria) it.categoria = it.info.categoria; if (!it.mes) it.mes = it.info.mes; it.estado = ""; }
          catch (e) { it.estado = "erro"; it.log = e.message; }
          desenhar();
        }
      };
      fi.onchange = () => { add([...fi.files]); fi.value = ""; };
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("on"); };
      dz.ondragleave = () => dz.classList.remove("on");
      dz.ondrop = e => { e.preventDefault(); dz.classList.remove("on"); add([...e.dataTransfer.files]); };
      $("#fgo", m).onclick = async () => {
        if (terminou) { m.remove(); return; }
        rodando = true; let ultimo = null;
        for (const it of itens.filter(x => x.estado !== "ok")) {
          if (!it.categoria || !it.mes) { it.estado = "erro"; it.log = "Preencha a categoria e o mês."; desenhar(); continue; }
          it.estado = "rodando"; it.log = ""; desenhar();
          try { const r = await api("ranking_importar", {arquivo: it.f.name, categoria: it.categoria, mes: it.mes}, {method: "POST", body: await it.f.arrayBuffer()});
            it.log = r.log.join("\n"); it.estado = "ok"; ultimo = r; }
          catch (e) { it.estado = "erro"; it.log = e.message; }
          desenhar();
        }
        rodando = false; terminou = true; desenhar();
        await carregarRankLista();
        if (ultimo) location.hash = `#/ranking/${encodeURIComponent(ultimo.categoria)}/${ultimo.mes}`;
        await rotear();
      };
    });
}

async function abrirMarca(marca, manterAba = false) {
  $("#main").innerHTML = `<div class="nload">${LOGO}<div class="nbarra"></div><div class="nmsg">Carregando ${esc(nome(marca))}</div></div>`;
  S.perMarca = S.perMarca || {};
  const per = S.perMarca[marca];
  try { S.rel = await api("relatorio", per ? {marca, periodo: per} : {marca}); }
  catch (e) {
    if (per) { delete S.perMarca[marca]; return abrirMarca(marca, manterAba); }   // período apagado: volta ao padrão
    $("#main").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  if (!manterAba && !(S.abrirProd && S.abrirProd.marca === marca)) S.aba = "oportunidades";
  S.tabelas = {};
  telaMarca();
  // 01/10 (Bruno: "ver mais" na calculadora): chega na marca com o quadro do produto aberto (todos os vendedores)
  if (S.abrirProd && S.abrirProd.marca === marca) { const p = S.abrirProd.produto; S.abrirProd = null;
    if ((S.rel.vendedores_produto || {})[p]) abrirVendedoresProduto(p); else toast("Este produto não está no último export da marca.", 5000); }
}

// 30/09 (Bruno: "opção de analisar os últimos 30 dias e os últimos 7 dias"): o export do Explorador vem por período (sem
// venda por dia), então cada período importado é uma opção; 7 e 30 dias aparecem quando o export desse período foi importado.
const rotuloPer = p => p.dias <= 8 ? "7 dias" : p.dias >= 28 && p.dias <= 31 ? "30 dias" : p.dias <= 16 ? `${p.dias} dias` : `Completo · ${p.dias} dias`;
function periodosMarca(r) {
  // 30/09 (Bruno: "coloca só o Completo, últimos 7 e últimos 30 — simples"): 1 chip por tipo, sempre o mais recente
  // de cada um (o histórico inteiro continua na aba Períodos)
  const todos = [...(r.periodos || [])].sort((a, b) => b.fim.localeCompare(a.fim) || b.dias - a.dias);
  const tipo = p => p.dias <= 8 ? 7 : p.dias >= 28 && p.dias <= 31 ? 30 : 0;
  const ps = [0, 30, 7].map(t => todos.find(p => tipo(p) === t)).filter(Boolean);
  if (r.atual && !ps.some(p => p.id === r.atual.id)) ps.push(r.atual);    // um período antigo escolhido na aba Períodos
  const falta = [[30, "30 dias"], [7, "7 dias"]].filter(([n]) => !ps.some(p => tipo(p) === n));
  return `<div class="per-marca"><span class="muted">Analisar:</span>
    ${ps.map(p => `<button class="per-chip ${p.id === r.atual.id ? "on" : ""}" data-per="${p.id}" title="${dataBR(p.inicio)} a ${dataBR(p.fim)} · ${esc(p.arquivo || "")}">
      <b>${rotuloPer(p)}</b> <small>${dataBR(p.inicio).slice(0, 5)}–${dataBR(p.fim).slice(0, 5)}</small></button>`).join("")}
    ${falta.map(([, t]) => `<span class="per-chip falta" title="No Nubimetrics, Explorador de anúncios: filtre a marca, escolha os últimos ${t} e exporte; depois importe aqui (⬆ Importar). O nubi guarda cada período e você troca por aqui.">+ ${t}: importe o export</span>`).join("")}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest(".per-chip[data-per]");
  if (!b || !S.rel) return;
  S.perMarca = S.perMarca || {}; S.perMarca[S.rel.marca] = +b.dataset.per;
  abrirMarca(S.rel.marca, true);
});

function tabela(el, chave, linhas, cols, extra = {}) {
  const st = S.tabelas[chave] ||= {busca: "", filtros: {}, ordem: extra.ordem || null, limite: extra.limite || 500};
  const opcoes = {};
  cols = cols.map(c => {
    if (c[3] !== "auto") return c;
    const n = new Set(linhas.map(r => r[c[0]])).size;
    return [c[0], c[1], c[2], n <= 30 ? "sel" : "txt"];
  });
  cols.forEach(([k, , , f]) => { if (f === "sel") opcoes[k] = [...new Set(linhas.map(r => r[k]).filter(v => v != null && v !== ""))].sort(); });
  const nota = typeof extra.nota === "function" ? extra.nota() : extra.nota;
  el.innerHTML = `<div class="card">
    <div class="toolbar">
      <input type="search" id="tb-busca" placeholder="Buscar em toda a tabela…" value="${esc(st.busca)}">

      <div style="flex:1"></div>
      ${extra.acoes ? `<button class="btn primary" id="bpesq">🔎 Rodar o agente agora</button>` : ""}
      <button class="btn small" id="tb-limpar">Limpar filtros</button>
    </div>
    ${nota ? `<div class="muted pad" style="padding:8px 14px;font-size:12.5px;border-bottom:1px solid var(--line)">${esc(nota)}</div>` : ""}
    ${extra.acoes ? `<div id="agente-box" class="muted" style="padding:8px 14px;font-size:12.5px;border-bottom:1px solid var(--line)"></div><div id="plog"></div>` : ""}
    <div class="tw"><table class="t"><thead>
      <tr>${cols.map(([k, l, f]) => `<th class="${NUM.has(f) ? "num" : ""}" data-k="${k}">${esc(l)}<span class="ar">${st.ordem && st.ordem[0] === k ? (st.ordem[1] > 0 ? "▲" : "▼") : ""}</span></th>`).join("")}</tr>
      <tr class="f">${cols.map(([k, , , f]) => `<th>${f === "sel" ? `<select data-f="${k}"><option value="">todos</option>${opcoes[k].map(o => `<option ${st.filtros[k] === String(o) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`
        : f === "txt" ? `<input data-f="${k}" placeholder="contém…" value="${esc(st.filtros[k] || "")}">` : ""}</th>`).join("")}</tr>
    </thead><tbody id="tb-corpo"></tbody></table></div>
    <div class="more hidden" id="tb-mais"><button class="btn small">Mostrar mais</button></div>
  </div>`;
  const desenhar = () => {
    const b = st.busca.toLowerCase();
    let rs = linhas.filter(r => {
      for (const [k, v] of Object.entries(st.filtros)) {
        if (!v) continue;
        const col = cols.find(c => c[0] === k);
        const val = String(r[k] ?? "");
        if (col[3] === "sel" ? val !== v : !val.toLowerCase().includes(v.toLowerCase())) return false;
      }
      return !b || cols.some(([k]) => String(r[k] ?? "").toLowerCase().includes(b));
    });
    if (st.ordem) {
      const [k, d] = st.ordem;
      rs = [...rs].sort((x, y) => { const a = x[k], c = y[k];
        if (a == null) return 1; if (c == null) return -1;
        if (typeof a !== "number" && typeof c !== "number") {   // números escritos como texto no arquivo
          const na = parseFloat(String(a).replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".")),
                nc = parseFloat(String(c).replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", "."));
          if (!isNaN(na) && !isNaN(nc) && /^[\s$R\d.,-]+$/.test(a) && /^[\s$R\d.,-]+$/.test(c)) return (na - nc) * d;
        }
        return (typeof a === "number" ? a - c : String(a).localeCompare(String(c), "pt-BR")) * d; });
    }
    $("#tb-cont", el).textContent = `${nf0.format(rs.length)} de ${nf0.format(linhas.length)} linhas`;
    $("#tb-corpo", el).innerHTML = rs.slice(0, st.limite).map(r => `<tr>${cols.map(([k, , f], i) => celula(r, k, f, i)).join("")}</tr>`).join("")
      || `<tr><td colspan="${cols.length}" class="empty">Nada para mostrar.</td></tr>`;
    $("#tb-mais", el).classList.toggle("hidden", rs.length <= st.limite);
    el.querySelectorAll("[data-edit]").forEach(bt => bt.onclick = () => corrigirGtin(linhas.find(x => x.gtin === bt.dataset.edit)));
    el.querySelectorAll("select.catsel").forEach(sel => sel.onchange = () => trocarCategoria(sel.dataset.cm, sel.value));
  };
  $("#tb-busca", el).oninput = e => { st.busca = e.target.value; desenhar(); };
  el.querySelectorAll("[data-f]").forEach(i => i[i.tagName === "SELECT" ? "onchange" : "oninput"] = e => { st.filtros[i.dataset.f] = e.target.value; desenhar(); });
  el.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k; st.ordem = st.ordem && st.ordem[0] === k ? [k, -st.ordem[1]] : [k, NUM.has(cols.find(c => c[0] === k)[2]) ? -1 : 1];
    tabela(el, chave, linhas, cols, extra);
  });
  $("#tb-limpar", el).onclick = () => { st.busca = ""; st.filtros = {}; tabela(el, chave, linhas, cols, extra); };
  $("#tb-mais button", el).onclick = () => { st.limite += 500; desenhar(); };
  if (extra.acoes) { $("#bpesq", el).onclick = () => pesquisarGtins($("#plog", el)); desenharAgente(); }
  desenhar();
}

function ligarMLBusca() {
  const inp = $("#ml-link"); if (!inp) return;
  const ir = tipo => { const v = inp.value.trim(); if (!v) return toast("Cole um link do Mercado Livre."); location.hash = `#/ml/${tipo}/${encodeURIComponent(v)}`; };
  $("#ml-ir-anuncio").onclick = () => ir("anuncio");
  $("#ml-ir-loja").onclick = () => ir("loja");
  inp.onkeydown = e => { if (e.key === "Enter") ir(/perfil\.|_CustId_|^\d+$/.test(inp.value.trim()) ? "loja" : "anuncio"); };
}
function telaML() {
  if (location.hash.split("?")[0].startsWith("#/ml/comparar")) return telaMLComparar();
  const m = location.hash.split("?")[0].match(/^#\/ml\/(anuncio|loja)\/(.+)$/);
  if (m) { const id = decodeURIComponent(m[2]); return m[1] === "anuncio" ? telaMLAnuncio(id) : telaMLLoja(id); }
  return telaMLInicio();
}

// Calculadora de margem: tarifa do ML (API, para a categoria e o tipo do anúncio), frete, impostos e o MEU custo (UpSeller)
function abrirCalcMargem(m) {
  const t = m.tarifa || {}, est = ((m.meu || {}).estoque || [])[0] || {};
  const bg = modal(`<h2>🧮 Calcular margem</h2><p class="muted" style="margin-top:0">${esc(m.titulo || "")}</p>
    <div class="calc-g">
      <label class="f">Preço de venda (R$)<input id="cm-preco" type="number" step="0.01" value="${m.preco ?? ""}"></label>
      <label class="f">Custo do produto (R$)<input id="cm-custo" type="number" step="0.01" value="${est.custo_medio ?? ""}">
        ${est.sku ? `<small class="muted">custo médio do UpSeller (${esc(est.sku)})</small>` : `<small class="muted">não achei no seu estoque: digite o custo</small>`}</label>
      <label class="f">Tarifa do ML (%)<input id="cm-pct" type="number" step="0.1" value="${t.pct ?? 14}">${t.pct == null ? `<small class="muted">estimada (a API não respondeu)</small>` : ""}</label>
      <label class="f">Tarifa fixa (R$)<input id="cm-fixa" type="number" step="0.01" value="${t.fixa ?? 0}"></label>
      <label class="f">Frete que você paga (R$)<input id="cm-frete" type="number" step="0.01" value="${m.frete_custo ?? 0}"></label>
      <label class="f">Impostos (%)<input id="cm-imp" type="number" step="0.1" value="0"></label>
    </div>
    <div id="cm-res" class="kpis" style="margin-top:14px"></div>
    <p class="muted" style="font-size:12px">Tarifa e frete pela API do Mercado Livre para a categoria e o tipo deste anúncio (${esc(m.tipo || "")}). A conta refaz a cada número.</p>
    <div style="display:flex;justify-content:flex-end"><button class="btn" data-fechar>Fechar</button></div>`);
  const calc = () => {

// 01/10 (Bruno: "como vincular os produtos ao meu estoque e puxar meu SKU, estoque e preço de custo?")
// 01/10 (Bruno: "o iconezinho da calculadora da extensão no monitor, que traz os dados do ML, e eu calculo com outro preço"):
// mesma conta do painel.js da extensão — tarifa % do ML + custo fixo abaixo de R$ 79, frete grátis do vendedor a partir de R$ 79,
// imposto, meu custo; e o preço para chegar numa margem
function pmCalc(x, cfg) {
  if (!x) return;
  const c = x.calc || {}, m = x.meu || {};
  const taxaFixa = p => p <= 0 || p >= 79 ? 0 : p < 12.5 ? p * 0.5 : p < 29 ? 6.25 : p < 50 ? 6.5 : 6.75;
  const pct0 = c.tarifa_pct != null ? c.tarifa_pct : (c.tarifa && c.preco ? Math.max(0, (c.tarifa - taxaFixa(c.preco)) / c.preco * 100) : null);
  const n = v => v == null || v === "" ? "" : String(Math.round(v * 100) / 100).replace(".", ",");
  const lerN = el => { const v = parseFloat(String(el.value).replace(/\./g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
  const lerP = el => { const v = parseFloat(String(el.value).replace(",", ".")); return isFinite(v) ? v : 0; };
  const ICO_CALC = `<svg viewBox="0 0 48 48" width="34" height="34" fill="none"><rect x="9" y="4" width="30" height="40" rx="6" fill="#fff"/>
    <rect x="13" y="8" width="22" height="9" rx="2" fill="#1d4ed8"/><text x="32" y="15.2" text-anchor="end" font-size="6.5" font-weight="800" fill="#fff" font-family="Arial">R$</text>
    ${[0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${13 + c * 8}" y="${21 + r * 7}" width="6" height="5" rx="1.5" fill="${c === 2 && r === 2 ? "#22c55e" : c === 2 ? "#f59e0b" : "#cbd5e1"}"/>`).join("")).join("")}</svg>`;

function pmVincular(x) {

      <button class="btn small" data-fechar>Fechar</button></div>`, bg => {
    const lista = bg.querySelector("#pv-lista");

      bg.remove(); toast(corpo.sku ? "Vinculado: o custo e o estoque já entram na conta." : "Salvo."); telaPrecos(); } catch (e) { toast(e.message, 5000); } };
    const buscar = async q => {
      try { const r = await api("ml_precos_estoque_busca", {q, mlb: x.mlb});
        bg.querySelector("#pv-dica").textContent = q ? `${r.itens.length} item(ns) do estoque com "${q}":` : "Sugestões pelo título do anúncio:";
        lista.innerHTML = r.itens.length ? r.itens.map(it => `<button class="pv-it ${x.sku_meu === it.sku ? "on" : ""}" data-sku="${esc(it.sku)}">
            <b>${esc(it.titulo || it.sku)}</b><span class="muted">${esc(it.sku)} · ${nf0.format(it.disponivel || 0)} disp.${it.transito_compra ? ` · ${nf0.format(it.transito_compra)} em trânsito` : ""}</span>
            <span class="pv-c">${it.custo_medio ? "custo " + rsES(+it.custo_medio) : "sem custo"}</span></button>`).join("")
          : `<div class="muted">${q ? "Nada no estoque com essas palavras." : "Sem sugestão pelo título: busque acima."}</div>`;
        lista.querySelectorAll("[data-sku]").forEach(el => el.onclick = () => salvar({sku: el.dataset.sku}));
      } catch (e) { lista.innerHTML = `<div class="muted">${esc(e.message)}</div>`; } };
    let t; bg.querySelector("#pv-q").oninput = e => { clearTimeout(t); t = setTimeout(() => buscar(e.target.value.trim()), 300); };
    bg.querySelector("#pv-nao").onclick = () => salvar({nenhum: true});
    const au = bg.querySelector("#pv-auto"); if (au) au.onclick = () => salvar({});
    buscar(""); bg.querySelector("#pv-q").focus();
  });
}

// 01/10 (Bruno, página do vendedor observado): abre o quadro do produto de qualquer tela; carrega o relatório da marca se preciso
async function abrirProdutoDeMarca(marca, prod) {
  if (!marca || !prod) return;

    toast(`Carregando ${nome(marca)}…`, 2500);
    try { S.rel = await api("relatorio", {marca}); S.marca = marca; S.tabelas = {}; } catch (e) { toast(e.message, 6000); return; }
  }

  abrirVendedoresProduto(prod);
