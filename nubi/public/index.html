<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nubi · Explorador de anúncios</title>
<!-- app no celular: Safari → Compartilhar → Adicionar à Tela de Início -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nubi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231F3864'/><path d='M8 22V10l8 8 8-8v12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1c2230; --muted:#667085; --line:#e4e7ec; --soft:#f0f2f5;
  --brand:#1F3864; --brand-ink:#ffffff; --accent:#2563eb; --good:#16794c; --good-bg:#e5f5ec;
  --bad:#b42318; --bad-bg:#fdecea; --warn:#9a6700; --warn-bg:#fff5d6; --focus:#93b4f5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --card:#171d27; --ink:#e6e9ef; --muted:#98a2b3; --line:#2a3342; --soft:#1e2531;
    --brand:#3b5b99; --accent:#6b9cff; --good:#4fc987; --good-bg:#153526; --bad:#ff7a6e; --bad-bg:#3a1a18;
    --warn:#f2c14e; --warn-bg:#3a3014; --focus:#3b5b99; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --card:#171d27; --ink:#e6e9ef; --muted:#98a2b3; --line:#2a3342; --soft:#1e2531;
  --brand:#3b5b99; --accent:#6b9cff; --good:#4fc987; --good-bg:#153526; --bad:#ff7a6e; --bad-bg:#3a1a18;
  --warn:#f2c14e; --warn-bg:#3a3014; --focus:#3b5b99; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
header.top .logo{font-weight:700;font-size:16px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;cursor:pointer}
header.top .logo small{font-weight:500;opacity:.8}
header.top .sp{flex:1}
header.top select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;max-width:240px}
header.top select option{color:#000}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
main{margin:0 auto;padding:20px clamp(16px,1.6vw,40px)}
/* Telas grandes (2K/4K): usa a largura toda e aumenta tudo na mesma proporção. */
@media (min-width:2200px){body{zoom:1.2}}
@media (min-width:2800px){body{zoom:1.4}}
@media (min-width:3400px){body{zoom:1.6}}
@media (min-width:1800px){.grid2{grid-template-columns:1.25fr 1fr}.tw{max-height:74vh}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)}
.alerta{color:var(--bad);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px;margin:14px 0}
.kpi{padding:12px}
.rk-plano{border-left:4px solid var(--accent)}.rk-form{display:grid;gap:8px}.rk-form textarea,.rk-form input,.rk-form select{width:100%;box-sizing:border-box}
.rk-lista{display:grid;gap:6px;margin-top:10px}.rk-it{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.rk-it summary{cursor:pointer;font-size:13px;overflow-wrap:anywhere}
.rk-corpo{margin-top:8px;font-size:13px}.rk-com{font-size:12.5px;border-left:2px solid var(--line);padding:2px 8px;margin-top:6px;overflow-wrap:anywhere}
.rk-acoes{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.rk-acoes input{flex:1;min-width:160px}
.po-lojas{display:grid;gap:6px}.po-loja{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.po-loja .muted{flex:1;min-width:0;font-size:12.5px;overflow-wrap:anywhere}
.po-lista{display:grid;gap:10px}.po-an{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.po-an img,.po-sem-foto{width:56px;height:56px;object-fit:contain;border-radius:8px;background:var(--soft);display:grid;place-items:center}
.po-tit{font-weight:600;font-size:13px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.po-termo{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.po-termo input{flex:1;min-width:0;padding:4px 8px;font-size:12.5px}.po-pos{text-align:right;font-size:13px;white-space:nowrap}.po-serie{font-size:11px;color:var(--muted)}
@media (max-width:600px){.po-an{grid-template-columns:48px minmax(0,1fr)}.po-pos{grid-column:2;text-align:left}}
.pi-pares{display:grid;gap:8px;margin-top:10px}.pi-par{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
.pi-par-t{flex:1 1 280px;min-width:0;overflow-wrap:anywhere}.pi-par-b{display:flex;gap:6px}
.kpi-link{cursor:pointer;transition:transform .12s,box-shadow .12s}.kpi-link:hover,.kpi-link:focus-visible{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.08);outline:none}
.kpi-link .l::after{content:" ›";color:var(--muted)}
.kpi .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .o{font-size:11.5px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.grid2>*{min-width:0}
.rolar{overflow-x:auto}
.grid2.gh{grid-template-columns:1fr 1fr}
@media (max-width:700px){.grid2.gh{grid-template-columns:1fr}}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 0;padding-bottom:0}
.tab{padding:9px 13px;border:none;background:none;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}
.tab .n{font-size:11px;background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:5px;color:var(--muted)}
.tab .n.warn{background:var(--warn-bg);color:var(--warn)}
.painel{margin-top:14px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:220px}
.tw{overflow:auto;max-height:70vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.t th{position:sticky;top:0;background:var(--brand);color:#fff;font-weight:600;font-size:12px;text-align:left;padding:8px 10px;white-space:nowrap;cursor:pointer;z-index:2;vertical-align:bottom}
table.t th.num{text-align:right}
table.t th .ar{opacity:.8;margin-left:3px}
table.t tr.f th{background:var(--soft);padding:4px 6px;cursor:default;top:33px}
table.t tr.f select,table.t tr.f input{width:100%;min-width:70px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 5px;font-size:12px;font-weight:400}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.num{text-align:right}
table.t td.wrap{white-space:normal;min-width:260px}
table.t tr:hover td{background:var(--soft)}
table.t td.first{font-weight:500}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.sinal{display:inline-block;border-radius:6px;padding:0 6px;margin:1px 3px 1px 0;font-size:11.5px;background:var(--soft)}
.sinal.good{background:var(--good-bg);color:var(--good)}
.sinal.bad{background:var(--bad-bg);color:var(--bad)}
.nota{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}
.more{padding:10px;text-align:center}
.login{max-width:420px;margin:12vh auto;padding:28px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--bg)}
.log{background:var(--soft);border-radius:8px;padding:10px 12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;
  padding:clamp(12px,3dvh,32px) 16px calc(clamp(12px,3dvh,32px) + env(safe-area-inset-bottom,0px));overflow:auto}
.modal{max-width:640px;width:100%;padding:18px;max-height:calc(100vh - (clamp(24px,6vh,64px) + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px)));
  max-height:calc(100dvh - (clamp(24px,6dvh,64px) + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px)));
  overflow:auto;overscroll-behavior:contain}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:600px){.form-row{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f input,label.f select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
.drop{display:block;margin-top:12px;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--soft)}
.prog{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .6s}
.barra{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;position:relative}
.barra::after{content:"";position:absolute;inset:0;width:35%;border-radius:3px;background:var(--accent);animation:barra 1.1s ease-in-out infinite}
@keyframes barra{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
.files .fi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.bcard{padding:16px;cursor:pointer;transition:border-color .15s}
.bcard:hover{border-color:var(--accent)}
.bcard .nm{font-weight:700;font-size:16px;padding-right:30px}
.bcard{position:relative}
.bdel{position:absolute;top:10px;right:10px;border:1px solid transparent;background:none;border-radius:8px;padding:3px 7px;font-size:14px;opacity:.35;cursor:pointer}
.bcard:hover .bdel{opacity:.8} .bdel:hover{opacity:1!important;border-color:var(--bad);background:var(--bad-bg)}
.multi{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.multi label{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--ink)} .multi label.muted b{font-weight:500}
.multi small{color:var(--muted)}
.bcard .mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:12.5px}
.bcard .mini b{display:block;font-size:15px}
.cfg-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px}
.cfg-row input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
svg.spark{display:block}
.top5 li{margin:6px 0}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 54px)}
.layout>main{margin:0;min-width:0}
aside.side{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.navi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;margin-bottom:4px}
.navi:hover{background:var(--soft)}
.navi.on{background:var(--soft);color:var(--accent)}
.navi .ic{font-size:18px;line-height:1.2}
.navi small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.subnav{display:flex;flex-direction:column;margin:0 0 8px 40px;border-left:1px solid var(--line)}
.subnav a{padding:5px 10px;color:var(--muted);text-decoration:none;font-size:13px}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:var(--accent);font-weight:600;border-left:2px solid var(--accent);margin-left:-1px}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside.side{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:none;border-bottom:1px solid var(--line)}.subnav{display:none}}
a.plink{color:inherit;text-decoration:none;border-bottom:1px dashed var(--muted);cursor:pointer}
a.plink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.modal.larga{max-width:1080px}
/* ---- Gráficos do B.I. (paleta categórica validada p/ daltonismo; escuro tem os próprios tons) ---- */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --dv-pos:#2a78d6;--dv-neg:#e34948;--dv-mid:#f0efec;--dv-outro:#b8bcc6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --dv-pos:#3987e5;--dv-neg:#e66767;--dv-mid:#383835;--dv-outro:#4a5263}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --dv-pos:#3987e5;--dv-neg:#e66767;--dv-mid:#383835;--dv-outro:#4a5263}
.vcab{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.vcab h1{margin:0}
.vabas{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.vabas a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.vabas a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.vabas .n{font-size:11px;border-radius:10px;padding:1px 7px;margin-left:3px}
.vabas .n.bad{background:var(--bad-bg);color:var(--bad)}
.bi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px;margin-top:14px}
@media (max-width:700px){.bi-grid{grid-template-columns:1fr}}
.bi-grid .card{min-width:0}
.bi-card h2{margin:0}
.bi-card .sub{font-size:12px;color:var(--muted);margin:2px 0 8px}
.ch{position:relative;width:100%}
.ch svg{display:block;overflow:visible}
.ch text{fill:var(--muted);font-size:11px;font-family:inherit}
.ch .lbl{fill:var(--ink);font-size:11.5px}
.ch .grid line{stroke:var(--line);stroke-width:1}
.ch .hit{fill:transparent;cursor:pointer}
.ch .mk:hover,.ch .mk.on{filter:brightness(1.12)}
.legenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:2px 0 6px}
.legenda span{display:inline-flex;align-items:center;gap:6px;cursor:default}
.legenda i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legenda i.q{width:10px;height:10px;border-radius:2px}
#dvtip{position:fixed;z-index:70;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.18);
  border-radius:8px;padding:8px 10px;font-size:12px;min-width:140px;max-width:320px}
#dvtip .tt{color:var(--muted);margin-bottom:4px}
#dvtip .r{display:flex;align-items:center;gap:8px;margin:2px 0}
#dvtip .r i{width:12px;height:2px;border-radius:1px;flex:none}
#dvtip .r b{font-variant-numeric:tabular-nums}
#dvtip .r span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:none;padding:5px 11px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--ink);font-weight:600}
.heat{border-collapse:separate;border-spacing:2px;font-size:11.5px;width:100%}
.heat td,.heat th{text-align:center;padding:4px 2px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.heat th{color:var(--muted);font-weight:500}
.heat td.nm{text-align:left;padding-right:8px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.heat td.c{cursor:default;min-width:44px}
.st{display:inline-block;border-radius:6px;padding:0 7px;font-size:11.5px;background:var(--soft);white-space:nowrap}
.st.good{background:var(--good-bg);color:var(--good)} .st.bad{background:var(--bad-bg);color:var(--bad)} .st.warn{background:var(--warn-bg);color:var(--warn)}

/* ===== Ajustes de layout (auditoria de UX, set/2026) ===== */
:root{--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--r-sm:6px;--r:8px;--fs-sm:12.5px;--fs-kpi:21px;
  --info:#1d4ed8;--info-bg:#eaf1ff;--th-leve:#f3f5f8;--header-h:54px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--info:#8fb3ff;--info-bg:#1a2640;--th-leve:#1e2531}}
:root[data-theme="dark"]{--info:#8fb3ff;--info-bg:#1a2640;--th-leve:#1e2531}
.card{min-width:0}
h2{font-size:15px;font-weight:650}
/* KPIs: 4 por linha (8 = 4×2, sem sobrar um sozinho) */
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp3);margin:var(--sp4) 0}
.kpis:has(> :nth-child(5):last-child){grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis:has(> :nth-child(3):last-child),.kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:1800px){.kpis:has(> :nth-child(8):last-child){grid-template-columns:repeat(8,minmax(0,1fr))}}

// ---------- API ----------
async function api(rota, params = {}, opts = {}) {
  const {data} = await sb.auth.getSession();
  const token = data.session?.access_token;
  const q = new URLSearchParams({r: rota, ...params});
  const res = await fetch("/api/app?" + q, {method: opts.method || "GET", body: opts.body,
    headers: {Authorization: "Bearer " + token, ...(opts.headers || {})}});
  if (opts.blob && res.ok) return res.blob();
  let j; try { j = await res.json(); } catch { j = {erro: "Resposta inválida do servidor (" + res.status + ")."}; }
  if (!res.ok || j.erro) {
    if (res.status === 401) { S.msgLogin = j.erro; await sb.auth.signOut(); }
    throw new Error(j.erro || "Erro " + res.status);
  }
  return j;
}
function toast(msg, ms = 3500) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

const TEMPO = {0: ["☀️", "céu limpo"], 1: ["🌤️", "poucas nuvens"], 2: ["⛅", "parcialmente nublado"], 3: ["☁️", "nublado"], 45: ["🌫️", "neblina"], 48: ["🌫️", "neblina"],
  51: ["🌦️", "garoa"], 53: ["🌦️", "garoa"], 55: ["🌦️", "garoa"], 61: ["🌧️", "chuva fraca"], 63: ["🌧️", "chuva"], 65: ["🌧️", "chuva forte"],
  71: ["🌨️", "neve"], 80: ["🌦️", "pancadas"], 81: ["🌧️", "pancadas"], 82: ["⛈️", "pancadas fortes"], 95: ["⛈️", "trovoadas"], 96: ["⛈️", "trovoadas"], 99: ["⛈️", "trovoadas"]};
const tempoDe = c => TEMPO[c] || TEMPO[Math.floor(c / 10) * 10] || ["🌡️", ""];
function datasVendas(hoje) {
  // datas que mexem com perfume no Brasil e nos marketplaces (as móveis são calculadas)
  const y = hoje.getFullYear(), d = (a, m, dia) => new Date(a, m - 1, dia);
  const nDom = (a, m, n) => { const x = d(a, m, 1); x.setDate(1 + (7 - x.getDay()) % 7 + 7 * (n - 1)); return x; };
  const ultSex = (a, m) => { const x = d(a, m + 1, 0); x.setDate(x.getDate() - (x.getDay() + 2) % 7); return x; };
  const pascoa = a => { const f = Math.floor, g = a % 19, c = f(a / 100), h = (c - f(c / 4) - f((8 * c + 13) / 25) + 19 * g + 15) % 30,
    i = h - f(h / 28) * (1 - f(29 / (h + 1)) * f((21 - g) / 11)), j = (a + f(a / 4) + i + 2 - c + f(c / 4)) % 7, l = i - j,
    m = 3 + f((l + 40) / 44); return d(a, m, l + 28 - 31 * f(m / 4)); };
  const lista = [];
  for (const a of [y, y + 1]) {
    const bf = ultSex(a, 11), cm = new Date(bf); cm.setDate(bf.getDate() + 3);
    lista.push(["Dia da Mulher", d(a, 3, 8)], ["Dia do Consumidor", d(a, 3, 15)], ["Páscoa", pascoa(a)], ["Dia das Mães", nDom(a, 5, 2)],
      ["Dia dos Namorados", d(a, 6, 12)], ["Dia dos Pais", nDom(a, 8, 2)], ["9.9", d(a, 9, 9)], ["Dia do Cliente", d(a, 9, 15)],
      ["10.10", d(a, 10, 10)], ["Dia das Crianças", d(a, 10, 12)], ["11.11", d(a, 11, 11)], ["Black Friday", bf], ["Cyber Monday", cm],
      ["12.12", d(a, 12, 12)], ["Natal", d(a, 12, 25)]);
  }
  const h0 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  return lista.map(([n, dt]) => ({n, dt, dias: Math.round((dt - h0) / 864e5)})).filter(x => x.dias >= 0).sort((a, b) => a.dias - b.dias).slice(0, 6);
}
// cidade da previsão do tempo na Início (pedido do Bruno, card #41); cada pessoa pode trocar no ✎ ao lado do nome
const CIDADE_PADRAO = {nome: "Maringá, PR", lat: -23.4205, lon: -51.9333};
async function carregarTempo(box) {
  let cid; try { cid = JSON.parse(localStorage.getItem("nubi.cidade") || "null"); } catch { cid = null; }
  cid = cid || CIDADE_PADRAO;
  try {
    const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cid.lat}&longitude=${cid.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo&forecast_days=3`)).json();
    const [ic, tx] = tempoDe(r.current.weather_code), dsem = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
    const ag = $("#in-agora"); if (ag) ag.textContent = `${ic} ${Math.round(r.current.temperature_2m)}° ${cid.nome}`;
    box.innerHTML = `<div class="in-tempo-agora"><span class="in-tempo-ic">${ic}</span><div><b>${Math.round(r.current.temperature_2m)}°</b>
        <div class="muted">${esc(tx)}</div></div><button class="in-cidade" id="in-cidade" title="Trocar a cidade">${esc(cid.nome)} ✎</button></div>
      <div class="in-tempo-dias">${r.daily.time.map((t, i) => `<div><span class="muted">${i ? dsem[new Date(t + "T12:00").getDay()] : "hoje"}</span>
        <span>${tempoDe(r.daily.weather_code[i])[0]}</span><span>${Math.round(r.daily.temperature_2m_max[i])}° <span class="muted">${Math.round(r.daily.temperature_2m_min[i])}°</span></span>
        <span class="muted" title="chance de chuva">${r.daily.precipitation_probability_max[i] ?? "—"}%</span></div>`).join("")}</div>`;
  } catch { box.innerHTML = `<div class="muted">Previsão do tempo indisponível agora. <button class="in-cidade" id="in-cidade">${esc(cid.nome)} ✎</button></div>`; }
  $("#in-cidade").onclick = async () => {
    const q = prompt("Cidade para a previsão do tempo:", cid.nome); if (!q) return;
    try {
      const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=pt&countryCode=BR`)).json();
      const x = (g.results || [])[0]; if (!x) return toast("Cidade não encontrada.");
      try { localStorage.setItem("nubi.cidade", JSON.stringify({nome: x.name, lat: x.latitude, lon: x.longitude})); } catch { /* sem armazenamento */ }
      carregarTempo(box);
    } catch { toast("Não consegui buscar a cidade agora."); }
  };
}

// Celular: toda tabela vira uma lista de cartões (rótulo da coluna ao lado de cada valor), sem rolagem para o lado.
function rotularTabelas(raiz) {
  (raiz || document).querySelectorAll("table.t:not([data-rot])").forEach(tb => {
    const cab = tb.querySelector("thead tr:not(.f)") || tb.querySelector("tr");
    if (!cab) return;
    const rot = [...cab.children].map(th => (th.innerText || th.textContent || "").replace(/[↑↓▲▼]/g, "").trim());
    tb.querySelectorAll("tbody tr").forEach(tr => [...tr.children].forEach((td, i) => { if (rot[i] && !td.dataset.l) td.dataset.l = rot[i]; }));
    tb.dataset.rot = 1;
  });
}

function mdSimples(t) {
  const linhas = esc(t || "").split(/\n/);
  let html = "", lista = false;
  for (let l of linhas) {
    // links que o nubi põe nos tópicos da IA: vendedor (#/…), produto (vprod:chave) e marca (marca:nome)
    l = l.replace(/\[([^\]]+)\]\(((?:#\/|vprod:|marca:)[^)\s]+)\)/g, (m, t, u) => {
      const v = u.includes(":") && !u.startsWith("#") ? esc(decodeURIComponent(u.slice(u.indexOf(":") + 1))) : "";
      return u.startsWith("#/") ? `<a class="md-lk" href="${u}">${t}</a>`
        : u.startsWith("vprod:") ? `<a href="#" class="plink md-lk" data-vprod="${v}" data-vend="">${t}</a>`
        : `<a href="#" class="plink rklink md-lk" data-rkm="${v}">${t}</a>`;
    });
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+?)\*(?=[\s:.,;)]|$)/g, "$1<b>$2</b>").replace(/\*/g, "");
    if (/^\s*#{1,4}\s/.test(l)) { if (lista) { html += "</ul>"; lista = false; } html += `<h3>${l.replace(/^\s*#+\s*/, "")}</h3>`; }
    else if (/^\s*[-*•]\s/.test(l)) { if (!lista) { html += "<ul>"; lista = true; } html += `<li>${l.replace(/^\s*[-*•]\s*/, "")}</li>`; }
    else if (l.trim()) { if (lista) { html += "</ul>"; lista = false; } html += `<p>${l}</p>`; }
  }
  return html + (lista ? "</ul>" : "");
}

// Pesquisa a categoria de cada marca (código de barras + internet + preço) e mostra as sugestões para aplicar.
async function pesquisarCategorias(lista) {
  const res = [];
  const bg = modal(`<div style="display:flex;gap:12px;align-items:flex-start"><div style="flex:1"><h2 style="margin:0">🔎 Pesquisando categorias</h2>
      <div class="muted" id="pq-st" style="margin-top:4px"></div></div><button class="btn" data-fechar>Fechar</button></div>
    <div id="pq-ia" style="margin-top:8px"></div>
    <div class="prog" style="margin:12px 0"><i id="pq-bar" style="width:0%"></i></div><div id="pq-lista"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn primary hidden" id="pq-todas">Aplicar as sugestões de confiança alta e média</button></div>`);
  bg.querySelector(".modal").classList.add("larga");
  const CONF = {alta: "good", "média": "warn", baixa: ""};
  const desenhar = () => {
    $("#pq-lista", bg).innerHTML = `<div class="rolar"><table class="t" style="font-size:12.5px"><thead><tr><th>Marca</th><th>Hoje</th><th>Sugestão</th><th>Confiança</th><th>Por quê</th><th></th></tr></thead><tbody>
      ${res.map((x, i) => `<tr><td class="first">${esc(x.marca)}</td><td>${ICO_CAT[x.atual]} ${esc(x.atual)}</td>
        <td>${x.erro ? `<span class="neg">${esc(x.erro)}</span>` : x.sugestao ? `<b style="color:${COR_CAT[x.sugestao]}">${ICO_CAT[x.sugestao]} ${esc(x.sugestao)}</b>` : `<span class="muted">sem pistas</span>`}</td>
        <td>${x.confianca ? `<span class="st ${CONF[x.confianca]}">${esc(x.confianca)}</span>` : ""}</td>
        <td class="wrap" style="min-width:300px">${(x.evidencias || []).slice(0, 4).map(e => `<div><small><b>${esc(e.fonte)}:</b> ${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.texto)}</a>` : esc(e.texto)}</small></div>`).join("") || `<small class="muted">nada encontrado</small>`}</td>
        <td class="acoes">${x.aplicado ? `<span class="st good">aplicado</span>` : x.sugestao && x.sugestao !== x.atual ? `<button class="btn small primary" data-apl="${i}">Aplicar</button>` : ""}
          ${x.google ? `<a class="btn small" href="${esc(x.google)}" target="_blank" rel="noopener">Google ↗</a>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
    bg.querySelectorAll("[data-apl]").forEach(b => b.onclick = () => aplicar([res[b.dataset.apl]]));
  };
  const aplicar = async xs => {
    const c = carregando(`Aplicando ${xs.length} categoria(s)`);
    try {
      for (const x of xs) { await api("ranking_categoria_salvar", {}, {method: "POST", body: JSON.stringify({marca: x.marca, categoria: x.sugestao})}); x.aplicado = true; }
      desenhar(); S.catsMudou = true; c.ok(xs.length === 1 ? `${xs[0].marca}: ${xs[0].sugestao}` : `${xs.length} marcas atualizadas`);
    } catch (e) { c.erro(e.message); }
  };
  for (let i = 0; i < lista.length; i++) {
    const m = lista[i];
    $("#pq-st", bg).textContent = `${i + 1} de ${lista.length}: ${m.marca}`;
    try {
      const r = await api("ranking_categoria_pesquisar", {}, {method: "POST", body: JSON.stringify({marca: m.marca, preco_medio: m.preco_medio})});
      res.push({...r, atual: m.categoria});
      if (i === 0) $("#pq-ia", bg).innerHTML = r.ia
        ? `<p class="aviso">Pesquisando com ${r.ia === "claude" ? "IA Claude" : "IA ChatGPT"} na web (pode levar uns segundos por marca), mais código de barras e preço.</p>`
        : `<p class="aviso warn">Sem IA configurada: só código de barras, Wikipédia e preço. Para pesquisar de verdade na web, coloque uma chave de IA no nubi (ChatGPT ou Claude).</p>`;
    } catch (e) { res.push({marca: m.marca, atual: m.categoria, erro: e.message}); }
    $("#pq-bar", bg).style.width = Math.round(100 * (i + 1) / lista.length) + "%";
    desenhar();
    if (!document.body.contains(bg)) return;         // fechou a janela: para
  }
  $("#pq-st", bg).textContent = `Pronto: ${res.filter(x => x.sugestao).length} de ${res.length} com sugestão. Confira as pistas antes de aplicar.`;
  const boas = res.filter(x => x.sugestao && x.sugestao !== x.atual && x.confianca !== "baixa");
  const bt = $("#pq-todas", bg);
  if (boas.length) { bt.classList.remove("hidden"); bt.textContent = `Aplicar as ${boas.length} sugestões de confiança alta e média`; bt.onclick = () => aplicar(boas.filter(x => !x.aplicado)); }
  // ao fechar, atualiza a tela se algo mudou
  new MutationObserver((_, obs) => { if (!document.body.contains(bg)) { obs.disconnect(); if (S.catsMudou) { S.catsMudou = false; telaCategorias(S.cats.categoria); } } })
    .observe(document.body, {childList: true});
}
async function trocarCategoria(marca, categoria) {

}

async function carregarVendLista() { try { S.vendLista = await api("vend_lista"); } catch { S.vendLista = []; } }
const vendLinkV = v => `<a href="#/vendedores/${encodeURIComponent(v)}" class="plink0">${esc(v)}</a>`;

const TAREFA = {diario: "atualização diária", vendedores: "vendedores", marcas: "MARCAS"};
function coletorAoVivo(e) {
  const pct = e.total ? Math.min(100, Math.round(100 * (e.feito || 0) / e.total)) : 0;
  return `<div class="card pad" style="background:var(--soft);margin:10px 0 14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="spin"></span><b>Coletando agora</b> · ${esc(TAREFA[e.tarefa] || e.tarefa)} · começou ${esc(quando(e.iniciado_em))}
      <span class="muted" style="margin-left:auto">${e.total ? `${e.feito || 0} de ${e.total} arquivo(s) · ${pct}%` : "preparando a lista…"}</span></div>
    <div class="prog" style="margin-top:10px"><i style="width:${pct}%"></i></div>
    ${e.atual ? `<div style="margin-top:8px;font-size:13px">Baixando: <b>${esc(e.atual)}</b></div>` : ""}
    <div class="log" id="coletor-log" style="max-height:260px">${esc(e.log || "")}</div>
    <div class="muted" style="font-size:12px;margin-top:6px">Atualiza sozinho a cada 4 segundos. Não feche o Chrome que o coletor abriu no Mac mini.</div></div>`;
}
function cartaoColetor() {

      ${feitos.slice(0, 6).map(e => `<tr><td>${esc(quando(e.terminado_em || e.iniciado_em))}</td><td>${esc(TAREFA[e.tarefa] || e.tarefa)}</td>

      : vivo ? "" : `<p class="muted" style="margin:0">Ainda não rodou. No Terminal do Mac mini, cole:</p>`}

    <div class="muted" style="font-size:12px;margin-top:6px">Todo dia às 7h00 ele baixa o que falta desde janeiro: os vendedores seguidos do grupo "perfumes" (meses fechados + mês atual até o último dia liberado pelo Nubimetrics, 2 dias de atraso) e o relatório MARCAS de cada mês fechado. Se a sessão do Nubimetrics expirar, aparece aqui como "falhou" e no Mac: rode <code>~/.nubi-coletor/coletor entrar</code>.</div></div>`;
}

    try { const cs = await api("coletor_status"); S.coletor = cs.execucoes; S.coletorPedido = cs.pedido; } catch { /* tenta de novo no próximo ciclo */ }
    desenharAgente();
    const card = $("#coletor-card");
    if (card && !document.querySelector(".modal-bg")) {
      const l = $("#coletor-log"), noFim = !l || l.scrollHeight - l.scrollTop - l.clientHeight < 30;

      if (n) n.scrollTop = noFim ? n.scrollHeight : l.scrollTop;
      S.coletorVivo = (S.coletor || []).some(coletorRodando);
      if (antes && !S.coletorVivo) { toast("📥 Coletor terminou. Atualizando os vendedores…", 5000); S.vendLista = null; rotear(); }
    }
    S.coletorVivo = (S.coletor || []).some(coletorRodando);
  }
  S.coletorT = setTimeout(cicloColetor, S.coletorVivo ? 4000 : 60000);
}

// ---------- Comparar concorrentes (período escolhido x período anterior do mesmo tamanho) ----------
const CC_CORES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
// Matriz do celular (card #34): uma métrica por vez, coluna do vendedor fixa. Preço médio não existe nesta
// comparação (só o "Preço Médio" do export do Nubimetrics conta como preço, nunca vendas/unidades) e por isso
// sempre aparece "Sem dados" aqui, em vez de inventar um cálculo (ticket = vendas/unidades seria outra métrica).
const CC_METRICAS = [
  {k: "v", nome: "Vendas R$", valor: v => v.v, variacao: v => v.var_v, fmt: abrev},
  {k: "u", nome: "Unidades", valor: v => v.u, variacao: v => v.var_u, fmt: x => nf0.format(x)},
  {k: "pm", nome: "Preço médio", valor: () => null, variacao: () => null, fmt: x => "R$ " + nf2.format(x)},

      try { await api("tarefa_responder", {}, {method: "POST", body: JSON.stringify({id: t.id, texto, decisao})}); }
      catch (e) { toast(e.message, 6000); $("#tf-txt", bg).value = texto; }
      finally { S.tfEnviando = false; env.disabled = false; atualizar(); }
    };
    $("#tf-env", bg).onclick = () => responder();
    $("#tf-txt", bg).onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); responder(); } };
    bg.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => responder(b.dataset.dec));
    $("#tf-status", bg).onchange = async e => {
      try { await api("reuniao_tarefa_salvar", {}, {method: "POST", body: JSON.stringify({id: t.id, status: e.target.value})}); toast("Status atualizado"); atualizar(); }
      catch (er) { toast(er.message, 6000); }
    };
  };
  const atualizar = async () => { try { const x = await api("tarefa_eventos", {id}); if (document.body.contains(bg)) desenhar(x); } catch { /* tenta de novo no próximo ciclo */ } };
  desenhar(r);
  const tm = setInterval(() => { if (!document.body.contains(bg)) { clearInterval(tm); telaDev(true); return; }
    if (![$("#tf-txt", bg), $("#tf-desc-ta", bg)].includes(document.activeElement) && !S.tfEnviando) atualizar(); }, 5000);
}

      series: [{nome: "vendeu no dia", cor: "var(--s1)", v: dAtual.map(d => d.estimado ? 0 : d.u)}, {nome: "média do intervalo", cor: "color-mix(in srgb, var(--s1) 30%, transparent)", v: dAtual.map(d => d.estimado ? d.u : 0)}],
      dica: i => [{cor: "var(--s1)", valor: nf1.format(dAtual[i].u) + " un", nome: dAtual[i].estimado ? "média do intervalo" : "vendeu no dia"}]}) : ($("#gp-dia", bg).innerHTML = `<div class="empty muted">As vendas por dia aparecem depois de 2 coletas diárias.</div>`);
  const g2 = () => grafLinhas($("#gp-mes", bg), {rotulos: ms.map(mesCurto), fmt: v => nf0.format(v) + " un", fmtEixo: eixoUn, pontos: true,
      series: vs.slice(0, 5).map((v, i) => ({nome: v.vendedor, cor: cores[i], v: ms.map(m => v.u[m] ?? null)}))});
  g1(); g2();
}
// Lista de marcas em "sinais": mostra as 8 maiores e o resto num modal.
function resumoSinais(xs, cls, f, titulo, n = 8) {
  const id = "rs" + Math.random().toString(36).slice(2, 8);
  (S.resumos ||= {})[id] = {xs, cls, f, titulo};
  return xs.slice(0, n).map(m => `<span class="sinal ${cls}">${f(m)}</span>`).join("")
    + (xs.length > n ? ` <a href="#" onclick="event.preventDefault();verResumo('${id}')">+${xs.length - n} outras</a>` : "");
}
function verResumo(id) {
  const {xs, cls, f, titulo} = S.resumos[id];
  modal(`<h2>${esc(titulo)} (${xs.length})</h2><div>${xs.map(m => `<span class="sinal ${cls}">${f(m)}</span>`).join("")}</div>
    <div style="text-align:right;margin-top:14px"><button class="btn" data-fechar>Fechar</button></div>`);
}
function abrirUploadVendedor() {
  const itens = [];
  const conhecidos = (S.vendLista || []).map(x => x.vendedor);
  modal(`<h2>Importar vendedor (mês fechado)</h2>
    <p class="muted" style="margin-top:0">O export de anúncios de um vendedor que você segue no Nubimetrics (.xlsx). O nome do arquivo vira o nome do vendedor — use o mesmo nome de sempre para o histórico juntar os meses.</p>
    <label class="drop" id="dz"><input type="file" id="fi" accept=".xlsx,.csv" multiple hidden>Clique ou arraste os arquivos aqui</label>
    <datalist id="vconh">${conhecidos.map(v => `<option value="${esc(v)}">`).join("")}</datalist>
    <div class="files" id="fl"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" data-fechar id="fcan">Cancelar</button><button class="btn primary" id="fgo" disabled>Importar</button></div>`,
    m => {
      const dz = $("#dz", m), fi = $("#fi", m);
      let rodando = false, terminou = false;
      const desenhar = () => {
        $("#fl", m).innerHTML = itens.map((it, i) => `<div class="fi"><b>${esc(it.f.name)}</b>
          ${it.info ? `<span class="muted">${nf0.format(it.info.anuncios)} anúncios · ${abrev(it.info.vendas)} · ${nf0.format(it.info.marcas)} marcas</span>` : ""}
          ${it.estado === "ok" ? ' <span class="pill good">importado</span>' : it.estado === "erro" ? ' <span class="pill bad">não importado</span>' : ""}
          <div class="form-row" style="grid-template-columns:2fr 1fr">
            <label class="f">Vendedor<input list="vconh" data-i="${i}" data-k="vendedor" value="${esc(it.vendedor)}"></label>
            <label class="f">Mês fechado<input type="month" data-i="${i}" data-k="mes" value="${it.mes}"></label>
          </div>
          ${it.estado === "rodando" || it.estado === "lendo" ? `<div class="barra" style="margin-top:10px"></div>` : ""}
          ${it.log ? `<div class="log">${esc(it.log)}</div>` : ""}</div>`).join("");
        m.querySelectorAll("[data-k]").forEach(inp => { inp.disabled = rodando || itens[inp.dataset.i].estado === "ok";
          inp.oninput = () => { itens[inp.dataset.i][inp.dataset.k] = inp.dataset.k === "vendedor" ? inp.value.toUpperCase() : inp.value; }; });
        const go = $("#fgo", m);
        if (terminou) { go.disabled = false; go.textContent = "Concluído"; }
        else { go.disabled = rodando || !itens.some(it => it.estado !== "ok") || itens.some(it => it.estado === "lendo"); go.textContent = rodando ? "Importando…" : "Importar"; }
        $("#fcan", m).classList.toggle("hidden", rodando || terminou);
      };
      const add = async files => {
        for (const f of files) {
          const it = {f, vendedor: "", mes: mesAnterior(), estado: "lendo", log: ""};
          itens.push(it); terminou = false; desenhar();
          try { it.info = await api("vend_analisar", {arquivo: f.name}, {method: "POST", body: await f.arrayBuffer()});
            it.vendedor = it.info.vendedor; if (it.info.mes) it.mes = it.info.mes; it.estado = ""; }
          catch (e) { it.estado = "erro"; it.log = e.message; }
          desenhar();
        }
      };
      fi.onchange = () => { add([...fi.files]); fi.value = ""; };
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("on"); };
      dz.ondragleave = () => dz.classList.remove("on");
      dz.ondrop = e => { e.preventDefault(); dz.classList.remove("on"); add([...e.dataTransfer.files]); };
      $("#fgo", m).onclick = async () => {
        if (terminou) { m.remove(); return; }
        rodando = true; let ultimo = null;
        for (const it of itens.filter(x => x.estado !== "ok")) {
          if (!it.vendedor || !it.mes) { it.estado = "erro"; it.log = "Preencha o vendedor e o mês."; desenhar(); continue; }
          it.estado = "rodando"; it.log = ""; desenhar();
          try { const r = await api("vend_importar", {arquivo: it.f.name, vendedor: it.vendedor, mes: it.mes}, {method: "POST", body: await it.f.arrayBuffer()});
            it.log = r.log.join("\n"); it.estado = "ok"; ultimo = r; }
          catch (e) { it.estado = "erro"; it.log = e.message; }
          desenhar();
        }
        rodando = false; terminou = true; desenhar();
        await carregarVendLista();
        if (ultimo) location.hash = `#/vendedores/${encodeURIComponent(ultimo.vendedor)}`;   // abre no mês mais recente
        await rotear();
      };
    });
}

// Marca oficial (master): o nome para onde vão as outras grafias.
const master = m => `<span class="master" title="Marca oficial (master): as outras grafias viram esta">${esc(m)}<sup class="reg">R</sup></span>`;
// Onde a grafia aparece, sempre no último mês/período de cada fonte (não é soma de meses).
function infoMarca(inf) {
  if (!inf) return "";
  const l = [];
  if (inf.ranking) l.push(`🏆 #${inf.ranking.posicao} no ranking de ${mesCurto(inf.ranking.mes)} · ${abrev(inf.ranking.vendas)} no mês`);
  if (inf.vendedores) l.push(`🏪 ${inf.vendedores.vendedores} vendedor(es) monitorado(s) · ${abrev(inf.vendedores.vendas)} em ${mesCurto(inf.vendedores.mes)}`);
  if (inf.explorador) l.push(`🔎 Explorador ${dataBR(inf.explorador.mes).slice(0, 5)} a ${dataBR(inf.explorador.fim).slice(0, 5)}: ${inf.explorador.vendedores} vendedor(es) · ${abrev(inf.explorador.vendas)}`);
  return l.map(t => `<br><small class="muted">${esc(t)}</small>`).join("");
}

function abrirUploadRanking() {
  const itens = [];
  const PADRAO_RK = /MARCAS[-_]+((?:MLB\d+[-_]?)+?)[-_]+(\d{4}-\d{2})/i;
  modal(`<h2>Importar relatório mensal de marcas</h2>
    <p class="muted" style="margin-top:0">O relatório “MARCAS” do Nubimetrics do mês fechado (.xlsx). Categoria e mês vêm do nome do arquivo, por exemplo <code>MARCAS-MLB1246-MLB6284-2026-08-01_1.xlsx</code>.</p>
    <label class="drop" id="dz"><input type="file" id="fi" accept=".xlsx,.csv" multiple hidden>Clique ou arraste os arquivos aqui</label>
    <div id="up-status" class="muted" style="margin-top:10px"></div><div class="files" id="fl"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" data-fechar id="fcan">Cancelar</button><button class="btn primary" id="fgo" disabled>Importar</button></div>`,
    m => {
      const dz = $("#dz", m), fi = $("#fi", m);
      let rodando = false, terminou = false;
      const desenhar = () => {
        $("#fl", m).innerHTML = itens.map((it, i) => `<div class="fi"><b>${esc(it.f.name)}</b>
          ${it.info ? `<span class="muted">${nf0.format(it.info.marcas)} marcas · ${abrev(it.info.vendas)} · 1ª: ${esc(it.info.primeira)}</span>` : ""}
          ${it.estado === "ok" ? ' <span class="pill good">importado</span>' : it.estado === "erro" ? ' <span class="pill bad">não importado</span>' : ""}
          <div class="form-row" style="grid-template-columns:2fr 1fr">
            <label class="f">Categoria (códigos do Mercado Livre)<input data-i="${i}" data-k="categoria" value="${esc(it.categoria)}" placeholder="MLB1246-MLB6284">
              ${it.info && it.info.categoria_nome ? `<span>${esc(it.info.categoria_nome)}</span>` : ""}</label>
            <label class="f">Mês<input type="month" data-i="${i}" data-k="mes" value="${it.mes}"></label>
          </div>
          ${it.estado === "rodando" || it.estado === "lendo" ? `<div class="barra" style="margin-top:10px"></div>` : ""}
          ${it.log ? `<div class="log">${esc(it.log)}</div>` : ""}</div>`).join("");
        m.querySelectorAll("[data-k]").forEach(inp => { inp.disabled = rodando || itens[inp.dataset.i].estado === "ok";
          inp.oninput = () => { itens[inp.dataset.i][inp.dataset.k] = inp.dataset.k === "categoria" ? inp.value.toUpperCase() : inp.value; }; });
        const go = $("#fgo", m);
        if (terminou) { go.disabled = false; go.textContent = "Concluído"; }
        else { go.disabled = rodando || !itens.some(it => it.estado !== "ok") || itens.some(it => it.estado === "lendo"); go.textContent = rodando ? "Importando…" : "Importar"; }
        $("#fcan", m).classList.toggle("hidden", rodando || terminou);
      };
      const add = async files => {
        for (const f of files) {
          const p = f.name.match(PADRAO_RK);
          const it = {f, categoria: p ? p[1].replace(/_/g, "-").replace(/-$/, "").toUpperCase() : "", mes: p ? p[2] : "", estado: "lendo", log: ""};
          itens.push(it); terminou = false; desenhar();
          try { it.info = await api("ranking_analisar", {arquivo: f.name}, {method: "POST", body: await f.arrayBuffer()});
            if (!it.categoria) it.categoria = it.info.categoria; if (!it.mes) it.mes = it.info.mes; it.estado = ""; }
          catch (e) { it.estado = "erro"; it.log = e.message; }
          desenhar();
        }
      };
      fi.onchange = () => { add([...fi.files]); fi.value = ""; };
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("on"); };
      dz.ondragleave = () => dz.classList.remove("on");
      dz.ondrop = e => { e.preventDefault(); dz.classList.remove("on"); add([...e.dataTransfer.files]); };
      $("#fgo", m).onclick = async () => {
        if (terminou) { m.remove(); return; }
        rodando = true; let ultimo = null;
        for (const it of itens.filter(x => x.estado !== "ok")) {
          if (!it.categoria || !it.mes) { it.estado = "erro"; it.log = "Preencha a categoria e o mês."; desenhar(); continue; }
          it.estado = "rodando"; it.log = ""; desenhar();
          try { const r = await api("ranking_importar", {arquivo: it.f.name, categoria: it.categoria, mes: it.mes}, {method: "POST", body: await it.f.arrayBuffer()});
            it.log = r.log.join("\n"); it.estado = "ok"; ultimo = r; }
          catch (e) { it.estado = "erro"; it.log = e.message; }
          desenhar();
        }
        rodando = false; terminou = true; desenhar();
        await carregarRankLista();
        if (ultimo) location.hash = `#/ranking/${encodeURIComponent(ultimo.categoria)}/${ultimo.mes}`;
        await rotear();
      };
    });
}

async function excluirMarca(marca) {
  const x = S.painel.find(p => p.marca === marca) || {};

function tabela(el, chave, linhas, cols, extra = {}) {
  const st = S.tabelas[chave] ||= {busca: "", filtros: {}, ordem: extra.ordem || null, limite: extra.limite || 500};
  const opcoes = {};
  cols = cols.map(c => {
    if (c[3] !== "auto") return c;
    const n = new Set(linhas.map(r => r[c[0]])).size;
    return [c[0], c[1], c[2], n <= 30 ? "sel" : "txt"];
  });
  cols.forEach(([k, , , f]) => { if (f === "sel") opcoes[k] = [...new Set(linhas.map(r => r[k]).filter(v => v != null && v !== ""))].sort(); });
  const nota = typeof extra.nota === "function" ? extra.nota() : extra.nota;
  el.innerHTML = `<div class="card">
    <div class="toolbar">
      <input type="search" id="tb-busca" placeholder="Buscar em toda a tabela…" value="${esc(st.busca)}">
      <span class="muted" id="tb-cont"></span>
      <div style="flex:1"></div>
      ${extra.acoes ? `<button class="btn primary" id="bpesq">🔎 Rodar o agente agora</button>` : ""}
      <button class="btn small" id="tb-limpar">Limpar filtros</button>
    </div>
    ${nota ? `<div class="muted pad" style="padding:8px 14px;font-size:12.5px;border-bottom:1px solid var(--line)">${esc(nota)}</div>` : ""}
    ${extra.acoes ? `<div id="agente-box" class="muted" style="padding:8px 14px;font-size:12.5px;border-bottom:1px solid var(--line)"></div><div id="plog"></div>` : ""}
    <div class="tw"><table class="t"><thead>
      <tr>${cols.map(([k, l, f]) => `<th class="${NUM.has(f) ? "num" : ""}" data-k="${k}">${esc(l)}<span class="ar">${st.ordem && st.ordem[0] === k ? (st.ordem[1] > 0 ? "▲" : "▼") : ""}</span></th>`).join("")}</tr>
      <tr class="f">${cols.map(([k, , , f]) => `<th>${f === "sel" ? `<select data-f="${k}"><option value="">todos</option>${opcoes[k].map(o => `<option ${st.filtros[k] === String(o) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`
        : f === "txt" ? `<input data-f="${k}" placeholder="contém…" value="${esc(st.filtros[k] || "")}">` : ""}</th>`).join("")}</tr>
    </thead><tbody id="tb-corpo"></tbody></table></div>
    <div class="more hidden" id="tb-mais"><button class="btn small">Mostrar mais</button></div>
  </div>`;
  const desenhar = () => {
    const b = st.busca.toLowerCase();
    let rs = linhas.filter(r => {
      for (const [k, v] of Object.entries(st.filtros)) {
        if (!v) continue;
        const col = cols.find(c => c[0] === k);
        const val = String(r[k] ?? "");
        if (col[3] === "sel" ? val !== v : !val.toLowerCase().includes(v.toLowerCase())) return false;
      }
      return !b || cols.some(([k]) => String(r[k] ?? "").toLowerCase().includes(b));
    });
    if (st.ordem) {
      const [k, d] = st.ordem;
      rs = [...rs].sort((x, y) => { const a = x[k], c = y[k];
        if (a == null) return 1; if (c == null) return -1;
        if (typeof a !== "number" && typeof c !== "number") {   // números escritos como texto no arquivo
          const na = parseFloat(String(a).replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".")),
                nc = parseFloat(String(c).replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", "."));
          if (!isNaN(na) && !isNaN(nc) && /^[\s$R\d.,-]+$/.test(a) && /^[\s$R\d.,-]+$/.test(c)) return (na - nc) * d;
        }
        return (typeof a === "number" ? a - c : String(a).localeCompare(String(c), "pt-BR")) * d; });
    }
    $("#tb-cont", el).textContent = `${nf0.format(rs.length)} de ${nf0.format(linhas.length)} linhas`;
    $("#tb-corpo", el).innerHTML = rs.slice(0, st.limite).map(r => `<tr>${cols.map(([k, , f], i) => celula(r, k, f, i)).join("")}</tr>`).join("")
      || `<tr><td colspan="${cols.length}" class="empty">Nada para mostrar.</td></tr>`;
    $("#tb-mais", el).classList.toggle("hidden", rs.length <= st.limite);
    el.querySelectorAll("[data-edit]").forEach(bt => bt.onclick = () => corrigirGtin(linhas.find(x => x.gtin === bt.dataset.edit)));
    el.querySelectorAll("select.catsel").forEach(sel => sel.onchange = () => trocarCategoria(sel.dataset.cm, sel.value));
  };
  $("#tb-busca", el).oninput = e => { st.busca = e.target.value; desenhar(); };
  el.querySelectorAll("[data-f]").forEach(i => i[i.tagName === "SELECT" ? "onchange" : "oninput"] = e => { st.filtros[i.dataset.f] = e.target.value; desenhar(); });
  el.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k; st.ordem = st.ordem && st.ordem[0] === k ? [k, -st.ordem[1]] : [k, NUM.has(cols.find(c => c[0] === k)[2]) ? -1 : 1];
    tabela(el, chave, linhas, cols, extra);
  });
  $("#tb-limpar", el).onclick = () => { st.busca = ""; st.filtros = {}; tabela(el, chave, linhas, cols, extra); };
  $("#tb-mais button", el).onclick = () => { st.limite += 500; desenhar(); };
  if (extra.acoes) { $("#bpesq", el).onclick = () => pesquisarGtins($("#plog", el)); desenharAgente(); }
  desenhar();
}
const vendLink = (cod, nomeV) => cod && S.rel && S.rel.produtos_vendedor && S.rel.produtos_vendedor[cod]

const prodLink = v => S.rel && S.rel.vendedores_produto && S.rel.vendedores_produto[v]
  ? `<a href="#" class="plink" data-prod="${esc(v)}" title="Ver os vendedores deste produto">${esc(v)}</a>` : esc(v);
function celula(r, k, f, i) {
  const v = r[k];
  if (f === "vprod") return `<td class="first wrap">${vprodLink(r.chave, v, r.vendedor || (S.vbi && S.vbi.vendedor))}</td>`;
  if (k === "produto") return `<td class="first">${prodLink(v)}</td>`;

  if (f === "sinais_rk") return `<td>${sinaisRk(v)}</td>`;
  if (f === "expl") return `<td>${v ? `<a href="#/${encodeURIComponent(v)}">abrir ↗</a>` : ""}</td>`;
  if (f === "vend") return `<td>${vendLink(r.codigo, v)}</td>`;
  if (f === "nota") return `<td class="num">${notaHTML(v)}</td>`;
  if (f === "sinais") return `<td>${sinaisHTML(v)}</td>`;
  if (f === "mov") return `<td>${movHTML(v)}</td>`;
  if (f === "conf") return `<td>${confHTML(v)}</td>`;
  if (f === "link") return `<td><a href="${esc(v)}" target="_blank" rel="noopener">pesquisar ↗</a></td>`;
  if (f === "editar") return `<td><button class="btn small" data-edit="${esc(r.gtin)}">Corrigir</button></td>`;
  if (f === "wrap") return `<td class="wrap">${esc(v)}</td>`;
  if (f === "sparku") return `<td>${sparkSerie(v)}</td>`;
  if (f === "pesq") return `<td><button class="btn small" title="Pesquisar a categoria desta marca" onclick="pesquisarCategorias([S.cats.marcas.find(m => m.marca === ${esc(JSON.stringify(r.marca))})])">🔎</button></td>`;
  if (f === "catsel") return `<td><select class="catsel" data-cm="${esc(r.marca)}" style="border-left:4px solid ${COR_CAT[v]}">
    ${[...S.cats.opcoes, "Sem categoria"].map(o => `<option ${o === v ? "selected" : ""} value="${o === "Sem categoria" ? "" : esc(o)}">${ICO_CAT[o]} ${esc(o)}</option>`).join("")}
    ${r.fonte === "manual" ? `<option value="">↺ voltar para a automática</option>` : ""}</select></td>`;
  if (f === "tend") return `<td>${pillH(v, TEND_CLS[v])}</td>`;
  if (f === "alerta") return `<td>${pillH(v, ALERTA_CLS[v])}</td>`;
  if (f === "var") return `<td class="num ${v > 0.2 ? "pos" : v < -0.2 ? "neg" : ""}">${FMT.var(v)}</td>`;
  const cls = [NUM.has(f) ? "num" : "", i === 0 ? "first" : ""].join(" ");
  return `<td class="${cls}">${esc((FMT[f] || FMT.txt)(v))}</td>`;
}

function telaHistorico(el) {
  const h = S.rel.historico;
  const per = h.periodos;
  const rot = p => p.inicio === p.fim ? dataBR(p.fim).slice(0, 5) : dataBR(p.inicio).slice(0, 5) + "–" + dataBR(p.fim).slice(0, 5);
  const linhas = h.linhas.map(l => ({...l, ultimo: l.serie[l.serie.length - 1]}));
  const spark = s => {
    const w = 120, hh = 26, mx = Math.max(...s, 0.0001);
    const pts = s.map((v, i) => `${(s.length === 1 ? w / 2 : i * w / (s.length - 1)).toFixed(1)},${(hh - 3 - v / mx * (hh - 6)).toFixed(1)}`).join(" ");
    return `<svg class="spark" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg>`;
  };
  el.innerHTML = `<div class="card">
    <div class="toolbar"><input type="search" id="hb" placeholder="Buscar produto…"><span class="muted">${per.length} períodos · giro/dia de cada produto</span></div>
    <div class="tw"><table class="t"><thead><tr><th>Produto</th><th>Categoria</th><th>Tendência</th>
      ${per.map(p => `<th class="num">${rot(p)}</th>`).join("")}<th class="num">Média anterior</th><th class="num">Último vs média</th><th class="num">Períodos com venda</th></tr></thead>
    <tbody id="hc"></tbody></table></div></div>`;
  const desenhar = () => {
    const b = $("#hb", el).value.toLowerCase();
    $("#hc", el).innerHTML = linhas.filter(l => !b || l.produto.toLowerCase().includes(b)).map(l => `<tr>
      <td class="first">${prodLink(l.produto)}</td><td>${esc(l.categoria)}</td><td>${spark(l.serie)}</td>
      ${l.serie.map(v => `<td class="num">${v ? nf1.format(v) : "·"}</td>`).join("")}
      <td class="num">${nf1.format(l.media_ant)}</td>
      <td class="num ${l.ultimo_vs_media > 0.2 ? "pos" : l.ultimo_vs_media < -0.2 ? "neg" : ""}">${FMT.var(l.ultimo_vs_media)}</td>
      <td class="num">${l.com_venda}</td></tr>`).join("");
  };
  $("#hb", el).oninput = desenhar;
  desenhar();
}

// ---------- Dúvidas: pesquisa e correção ----------
async function pesquisarGtins(logEl) {
  const bt = $("#bpesq"); bt.disabled = true; bt.innerHTML = '<span class="spin"></span> Agente pesquisando…';
  logEl.innerHTML = `<div class="log pad">Consultando as bases de GTIN, dos que mais vendem para os que menos vendem (até 4 minutos)…</div>`;
  S.agenteRodando = true; desenharAgente();
  try {
    const r = await api("pesquisar", {marca: S.marca}, {method: "POST"});
    S.agente = r;
    logEl.innerHTML = `<div class="log">${esc(r.log.join("\n"))}</div>`;
    toast(`Agente: ${r.encontrados} encontrado(s) de ${r.pesquisados} pesquisado(s). Atualizando…`);
    S.agenteRodando = false;
    await abrirMarca(S.marca, true);
  } catch (e) { logEl.innerHTML = `<div class="log">${esc(e.message)}</div>`; bt.disabled = false; bt.textContent = "🔎 Rodar o agente agora"; }
  finally { S.agenteRodando = false; desenharAgente(); }
}
// ---------- Agente de GTIN automático ----------
// Roda sozinho depois de cada importação, uma vez por dia na nuvem e, enquanto a página
// estiver aberta, a cada 10 minutos (1 hora quando não há mais nada pendente).
const ORIGEM = {"agendado": "rodada diária", "importação": "após importar", "página": "página aberta", "manual": "manual"};
function quando(iso) {
  if (!iso) return "";
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  return min < 1 ? "agora" : min < 60 ? `há ${min} min` : min < 1440 ? `há ${Math.round(min / 60)} h` : `há ${Math.round(min / 1440)} dia(s)`;
}
function desenharAgente() {
  const c = (S.coletor || [])[0], ec = $("#coletor-st"), pill = $("#st-pill");
  if (pill) {
    const vivo = coletorRodando(c), pct = vivo && c.total ? Math.round(100 * (c.feito || 0) / c.total) : 0;
    pill.className = "status-pill " + (!c ? "nada" : vivo ? "rodando" : c.ok || c.em_andamento ? "" : "erro");
    pill.innerHTML = `<span class="pt"></span><span class="tx">${!c ? (S.coletor ? "Coletor: instalar" : "Coletor") : vivo ? `Coletando${c.total ? ` ${c.feito || 0}/${c.total}` : "…"}`
      : c.ok ? `Coletor · ${quando(c.terminado_em || c.iniciado_em)}` : c.em_andamento ? "Coletor parou" : "Coletor falhou"}${S.agenteRodando ? " · 🤖" : ""}</span>
      ${vivo ? `<span class="fio" style="width:${pct}%"></span>` : ""}`;
    const a = S.agente;
    pill.title = (c ? `Coletor: ${c.mensagem || ""}` : "Coletor ainda não instalado") + (S.agenteRodando ? "\nAgente de GTIN pesquisando…"
      : a ? `\nAgente de GTIN: última rodada ${quando(a.terminado_em)}, ${a.restantes ? a.restantes + " na fila" : "fila vazia"}` : "");
  }
  if (ec) ec.innerHTML = !c ? `📥 Coletor Nubimetrics: <a href="#/vendedores">instalar</a>`
    : coletorRodando(c) ? `<a href="#/vendedores" style="color:inherit;text-decoration:none"><span class="spin"></span> Coletor baixando${c.total ? ` ${c.feito || 0}/${c.total}` : "…"}
      <div class="prog" style="height:6px;margin-top:6px"><i style="width:${c.total ? Math.round(100 * (c.feito || 0) / c.total) : 0}%"></i></div>
      <small>${esc((c.atual || "").slice(0, 60))}</small></a>`
    : `📥 Coletor Nubimetrics · ${quando(c.terminado_em || c.iniciado_em)}<br><small class="${c.ok ? "" : "neg"}">${c.ok ? "ok" : "falhou"} · ${esc((c.mensagem || "").slice(0, 70))}</small>`;
  const a = S.agente, el = $("#agente-st");
  if (el) el.innerHTML = S.agenteRodando ? `<span class="spin"></span> Agente de GTIN pesquisando…`
    : !a ? `🤖 Agente de GTIN ligado`
    : `🤖 Agente de GTIN · ${quando(a.terminado_em)}<br><small>${a.encontrados} achado(s) na última rodada · ${a.restantes ? a.restantes + " na fila" : "fila vazia"}</small>`;
  const box = $("#agente-box");
  if (box) box.innerHTML = !a ? `<b>🤖 Agente automático</b> ligado: pesquisa os GTINs em dúvida depois de cada importação, 1× por dia e a cada 10 min com a página aberta.`
    : `<b>🤖 Agente automático</b> · última rodada ${quando(a.terminado_em)} (${esc(ORIGEM[a.origem] || a.origem)}${a.marca ? " · " + esc(nome(a.marca)) : ""}):
    pesquisou ${a.pesquisados}, achou ${a.encontrados}, não encontrou ${a.nao_encontrados}${a.sem_resposta ? `, ${a.sem_resposta} sem resposta das bases` : ""} ·
    ${a.restantes ? `<b>${a.restantes}</b> ainda na fila` : "fila vazia"}. Ele roda depois de cada importação, 1× por dia e a cada 10 min com a página aberta.
    O que não existe em nenhuma base fica aqui para você corrigir à mão (e é pesquisado de novo depois de 30 dias).`;
}
async function carregarAgente() {
  try { const st = await api("agente_status"); S.agente = st.execucoes[0] || null; } catch { S.agente = null; }
  try { const cs = await api("coletor_status"); S.coletor = cs.execucoes; S.coletorPedido = cs.pedido; } catch { S.coletor = []; }
  desenharAgente();
}
async function cicloAgente() {
  clearTimeout(S.agenteT);
  let prox = 10 * 60000;
  if (S.sessao && !S.agenteRodando) {
    S.agenteRodando = true; desenharAgente();
    try {
      const r = await api("agente", {origem: "página", segundos: 90}, {method: "POST"});
      S.agente = r;
      if (!r.restantes) prox = 60 * 60000;
      if (r.regra_aplicada) {
        toast("🤖 Agrupamento atualizado: mesmo GTIN = mesmo produto.", 6000);
        if (!document.querySelector(".modal-bg")) { if (S.marca) abrirMarca(S.marca, true); else if (secaoAtual() === "explorador") { await carregarPainel(); rotear(); } }
      } else if (r.encontrados) {
        toast(`🤖 Agente de GTIN: ${r.encontrados} GTIN(s) identificado(s)${r.marcas.length ? " em " + r.marcas.map(nome).join(", ") : ""}.`, 6000);
        if (S.marca && r.marcas.includes(S.marca) && !document.querySelector(".modal-bg")) abrirMarca(S.marca, true);
      }
    } catch (e) { prox = 15 * 60000; }
    S.agenteRodando = false; desenharAgente();
  }
  S.agenteT = setTimeout(cicloAgente, prox);
}
function corrigirGtin(d) {
  modal(`<h2>Corrigir GTIN ${esc(d.gtin)}</h2>
    <p class="muted" style="margin-top:0">Escreva o nome oficial do produto (marca, linha, tipo e volume). Ele passa a valer mais que os títulos dos anúncios.</p>
    <p style="font-size:12.5px"><b>Títulos:</b> ${esc(d.titulos)}</p>
    <label class="f">Nome oficial<input id="gn" value="${esc(d.nome_pesquisado || "")}" placeholder="ex.: Montblanc Starwalker Eau de Toilette 75 ml"></label>
    <label class="f" style="margin-top:10px">Marca<input id="gm" value="${esc(d.marca_pesquisada || nome(S.marca))}"></label>
    <p style="margin:12px 0 0"><a href="${esc(d.link)}" target="_blank" rel="noopener">Pesquisar este GTIN no Google ↗</a></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" data-fechar>Cancelar</button><button class="btn primary" id="gs">Salvar e reprocessar</button></div>`,
    async m => {
      $("#gs", m).onclick = async () => {
        $("#gs", m).disabled = true; $("#gs", m).innerHTML = '<span class="spin"></span> Salvando…';
        try { await api("gtin", {marca: S.marca}, {method: "POST", body: JSON.stringify({gtin: d.gtin, nome: $("#gn", m).value, marca: $("#gm", m).value})});
          m.remove(); toast("GTIN corrigido."); await abrirMarca(S.marca, true);
        } catch (e) { toast(e.message); $("#gs", m).disabled = false; $("#gs", m).textContent = "Salvar e reprocessar"; }
      };
    });
}

async function telaConfig(el) {
  el.innerHTML = `<div class="card pad"><span class="spin"></span> Carregando…</div>`;
  let linhas;
  try { linhas = (await api("config", {marca: S.marca})).linhas; } catch (e) { el.innerHTML = `<div class="card pad">${esc(e.message)}</div>`; return; }
  const desenhar = () => {
    el.innerHTML = `<div class="card pad">
      <h2>Linhas de produto de ${esc(nome(S.marca))}</h2>
      <p class="muted" style="margin-top:0">Texto a procurar no título (minúsculo, sem acento) → nome que aparece no relatório. Nomes compostos antes dos curtos; duas chaves podem apontar para o mesmo nome (apelidos).</p>
      <div id="cfl">${linhas.map((p, i) => `<div class="cfg-row"><input data-i="${i}" data-j="0" value="${esc(p[0])}" placeholder="texto no título">
        <input data-i="${i}" data-j="1" value="${esc(p[1])}" placeholder="nome no relatório"><button class="btn small" data-del="${i}">✕</button></div>`).join("")}</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn" id="cfa">+ Adicionar linha</button>
        <button class="btn" id="cfr" title="Descarta esta lista e detecta de novo pelos títulos do período mais recente">↻ Detectar linhas de novo</button>
        <div style="flex:1"></div>
        <button class="btn primary" id="cfs">Salvar e reprocessar</button></div>
      <div id="cflog"></div></div>`;
    el.querySelectorAll("#cfl input").forEach(i => i.oninput = () => { linhas[i.dataset.i][i.dataset.j] = i.value; });
    el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { linhas.splice(+b.dataset.del, 1); desenhar(); });
    $("#cfa", el).onclick = () => { linhas.unshift(["", ""]); desenhar(); $("#cfl input", el).focus(); };
    $("#cfr", el).onclick = async () => {
      if (!confirm("Descartar a lista atual e detectar as linhas de novo pelos títulos do período mais recente?")) return;
      const bt = $("#cfr", el); bt.disabled = true; bt.innerHTML = '<span class="spin"></span> Detectando…';
      try { await api("redetectar", {marca: S.marca}, {method: "POST"});
        toast("Linhas detectadas de novo e histórico reprocessado."); await abrirMarca(S.marca, true);
      } catch (e) { $("#cflog", el).innerHTML = `<div class="log">${esc(e.message)}</div>`; bt.disabled = false; bt.textContent = "↻ Detectar linhas de novo"; }
    };
    $("#cfs", el).onclick = async () => {
      const bt = $("#cfs", el); bt.disabled = true; bt.innerHTML = '<span class="spin"></span> Reprocessando…';
      try { await api("config", {marca: S.marca}, {method: "POST", body: JSON.stringify({linhas: linhas.filter(p => p[0].trim())})});
        toast("Configuração salva e histórico reprocessado."); await abrirMarca(S.marca, true);
      } catch (e) { $("#cflog", el).innerHTML = `<div class="log">${esc(e.message)}</div>`; bt.disabled = false; bt.textContent = "Salvar e reprocessar"; }
    };
  };
  desenhar();
}

// ---------- Upload ----------
const PADRAO = /^(.+?)__(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})\.csv$/i;
const compacta = t => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]/g, "");
async function abrirUpload() {
  const itens = [];
  let marcas = S.painel.map(p => p.marca);
  try { marcas = await api("marcas"); } catch {}
  modal(`<h2>Importar exports do Nubimetrics</h2>
    <p class="muted" style="margin-top:0">Arraste um ou mais CSVs. A marca é lida do próprio arquivo (coluna Marca) e a grafia oficial é confirmada pelos GTINs. Se o arquivo misturar marcas (ex.: a busca "Dolce" traz Dolce & Gabbana e o Egeo Dolce do Boticário), você escolhe quais viram card, cada uma com os seus produtos.</p>
    <label class="drop" id="dz"><input type="file" id="fi" accept=".csv,text/csv" multiple hidden>Clique ou arraste os arquivos aqui</label>
    <div id="up-status" class="muted" style="margin-top:10px"></div>
    <div class="files" id="fl"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" data-fechar id="fcan">Cancelar</button><button class="btn primary" id="fgo" disabled>Importar</button></div>`,
    m => {
      const dz = $("#dz", m), fi = $("#fi", m);
      let rodando = false, terminou = false;
      const analisar = async it => {
        it.estado = "analisando"; desenhar();
        try {
          const r = await api("analisar", {arquivo: it.f.name}, {method: "POST", body: await it.f.arrayBuffer(), headers: {"Content-Type": "text/csv"}});
          it.info = r; it.marca = r.marca || ""; it.manual = !r.marca;
          const gs = r.grupos || [], sug = gs.filter(g => g.sugerida);
          // várias marcas relevantes no mesmo arquivo (ex.: busca "Dolce" trouxe D&G e Boticário): uma por card
          it.multi = sug.length >= 2 || (gs.length > 1 && gs[0].pct < 0.9);
          it.escolha = new Set(sug.map(g => g.chave));
          if (r.inicio && !it.inicio) { it.inicio = r.inicio; it.fim = r.fim; }
          it.estado = "";
        } catch (e) { it.estado = "erro"; it.log = e.message; }
        // Período ainda vazio: copia do arquivo anterior da mesma leva (costumam ser do mesmo período).
        if (!it.inicio) { const o = itens.find(x => x !== it && x.inicio); if (o) { it.inicio = o.inicio; it.fim = o.fim; } }
        desenhar();
      };
      const add = files => {
        const novos = [];
        for (const f of files) {
          const p = f.name.match(PADRAO);
          const it = {f, marca: "", manual: false, info: null, inicio: p ? p[2] : "", fim: p ? p[3] : "", log: "", estado: ""};
          itens.push(it); novos.push(it);
        }
        terminou = false; desenhar();
        novos.reduce((pr, it) => pr.then(() => analisar(it)), Promise.resolve());
      };
      const blocoMulti = (it, i) => `<div class="f" style="font-size:12.5px;color:var(--muted);grid-column:1/-1">
        <b style="color:var(--ink)">Este arquivo mistura ${it.info.grupos.length} marcas.</b> Cada marca marcada vira um card próprio com os produtos dela
        (grafias da mesma marca já foram juntadas). Todas vêm marcadas: cada marca e cada vendedor é mais dado para analisar; desmarque só o que não quiser.
        <a href="#" data-todas="${i}">marcar/desmarcar todas</a>
        <div class="multi">${it.info.grupos.map(g => `<label class="${g.sugerida ? "" : "muted"}"><input type="checkbox" data-mg="${i}" value="${esc(g.chave)}" ${it.escolha.has(g.chave) ? "checked" : ""}>
          <b>${esc(g.nome)}</b> <span>${nf0.format(g.anuncios)} anúncios · R$ ${nf0.format(g.fat)} · ${FMT.pct(g.pct)}${g.existente ? " · já tem card" : ""}</span>
          ${g.grafias.length > 1 ? `<small title="grafias juntadas">(${esc(g.grafias.slice(0, 5).join(", "))})</small>` : ""}</label>`).join("")}</div></div>`;
      const blocoMarca = (it, i) => {
        if (it.multi && it.info) return blocoMulti(it, i);
        if (it.estado === "analisando") return `<div class="f" style="font-size:12.5px;color:var(--muted)">Marca<div style="padding:8px 0"><span class="spin"></span> lendo o arquivo…</div></div>`;
        if (!it.manual && it.info && it.info.marca) {
          const inf = it.info;
          const origem = inf.oficial ? `grafia oficial confirmada pelo GTIN ${esc(inf.gtin)} (${esc(inf.fonte)})` : "como está na coluna Marca do arquivo";
          const ren = inf.existente && inf.existente !== inf.marca ? `<br><span class="pill warn">a marca ${esc(nome(inf.existente))} será renomeada para ${esc(inf.nome)}</span>` : "";
          return `<div class="f" style="font-size:12.5px;color:var(--muted)">Marca
            <div style="font-size:15px;font-weight:700;color:var(--ink);margin-top:4px">${esc(inf.nome)}</div>
            <div>${origem}${inf.existente ? " · já cadastrada" : " · marca nova"} · <a href="#" data-alt="${i}">alterar</a>${ren}</div></div>`;
        }
        return `<label class="f">Marca<select data-i="${i}" data-k="sel"><option value="">escolha…</option>
             ${marcas.map(mm => `<option value="${esc(mm)}" ${mm === it.marca ? "selected" : ""}>${esc(nome(mm))}</option>`).join("")}
             <option value="__nova__" ${it.nova ? "selected" : ""}>+ Nova marca…</option></select>
             ${it.nova ? `<input data-i="${i}" data-k="marca" value="${esc(it.marca)}" placeholder="nome da marca" style="margin-top:6px">` : ""}</label>`;
      };
      const desenhar = () => {
        $("#fl", m).innerHTML = itens.map((it, i) => {
          const inf = it.info;
          const outras = inf && !it.multi && inf.outras && inf.outras.length
            ? `<div class="muted" style="font-size:12px;margin-top:8px">Outras marcas no arquivo (ficam separadas): ${inf.outras.slice(0, 6).map(o => `${esc(o.marca)} (${nf0.format(o.un)} un.)`).join(", ")}${inf.outras.length > 6 ? ` e mais ${inf.outras.length - 6}` : ""}</div>` : "";
          return `<div class="fi">
          <b>${esc(it.f.name)}</b> <span class="muted">${inf ? nf0.format(inf.anuncios) + " anúncios · " + nf0.format(inf.un) + " un." : nf0.format(it.f.size / 1024) + " KB"}</span>
          ${it.estado === "ok" ? ' <span class="pill good">importado</span>' : it.estado === "erro" ? ' <span class="pill bad">não importado</span>' : ""}
          <div class="form-row" style="grid-template-columns:1.4fr 1fr 1fr">
            ${blocoMarca(it, i)}
            <label class="f">Início<input type="date" data-i="${i}" data-k="inicio" value="${it.inicio}"></label>
            <label class="f">Fim<input type="date" data-i="${i}" data-k="fim" value="${it.fim}"></label>
          </div>${outras}
          ${it.estado === "rodando" || it.estado === "analisando" ? `<div class="barra" style="margin-top:10px"></div><div class="muted" style="font-size:12px;margin-top:4px">${it.estado === "rodando" ? "Lendo, consolidando e gravando…" : "Identificando a marca…"}</div>` : ""}
          ${it.log ? `<div class="log">${esc(it.log)}</div>` : ""}</div>`;
        }).join("");
        m.querySelectorAll("[data-k]").forEach(inp => {
          const it = itens[inp.dataset.i];
          inp.disabled = rodando || it.estado === "ok";
          inp[inp.tagName === "SELECT" ? "onchange" : "oninput"] = () => {
            if (inp.dataset.k === "sel") {
              it.nova = inp.value === "__nova__"; it.marca = it.nova ? "" : inp.value; it.manual = true;
              if (it.nova) { desenhar(); $(`[data-i="${inp.dataset.i}"][data-k="marca"]`, m).focus(); }
            } else it[inp.dataset.k] = inp.dataset.k === "marca" ? inp.value.toUpperCase() : inp.value;
          };
        });
        m.querySelectorAll("[data-todas]").forEach(a => a.onclick = e => {
          e.preventDefault(); const it = itens[a.dataset.todas];
          it.escolha = it.escolha.size ? new Set() : new Set(it.info.grupos.filter(g => g.chave !== "SEMMARCA").map(g => g.chave)); desenhar();
        });
        m.querySelectorAll("[data-mg]").forEach(cb => {
          cb.disabled = rodando || itens[cb.dataset.mg].estado === "ok";
          cb.onchange = () => { const e = itens[cb.dataset.mg].escolha; cb.checked ? e.add(cb.value) : e.delete(cb.value); };
        });
        m.querySelectorAll("[data-alt]").forEach(a => a.onclick = e => {
          e.preventDefault(); const it = itens[a.dataset.alt]; it.manual = true;
          it.marca = marcas.includes(it.marca) ? it.marca : ""; it.nova = false; desenhar();
        });
        const pend = itens.filter(it => it.estado !== "ok").length;
        const analisando = itens.some(it => it.estado === "analisando");
        const go = $("#fgo", m);
        if (terminou) { go.disabled = false; go.textContent = "Concluído"; }
        else { go.disabled = rodando || analisando || !pend; go.textContent = rodando ? "Importando…" : analisando ? "Lendo arquivos…" : "Importar"; }
        $("#fcan", m).classList.toggle("hidden", rodando || terminou);
        dz.classList.toggle("hidden", rodando);
      };
      fi.onchange = () => { add(fi.files); fi.value = ""; };
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("on"); };
      dz.ondragleave = () => dz.classList.remove("on");
      dz.ondrop = e => { e.preventDefault(); dz.classList.remove("on"); add(e.dataTransfer.files); };
      $("#fgo", m).onclick = async () => {
        if (terminou) { m.remove(); return; }
        rodando = true;
        let ultima = null, feitos = 0;
        const fila = itens.filter(it => it.estado !== "ok");
        for (const it of fila) {
          feitos++;
          $("#up-status", m).innerHTML = `<span class="spin"></span> Importando ${feitos} de ${fila.length}…`;
          const marcaManual = it.manual ? (marcas.find(x => compacta(x) === compacta(it.marca)) || it.marca.trim().toUpperCase()) : "";
          if ((it.manual && !it.multi && !marcaManual) || !it.inicio || !it.fim || (it.multi && !it.escolha.size)) {
            it.estado = "erro"; it.log = !it.inicio || !it.fim ? "Preencha o início e o fim do período." : it.multi ? "Marque pelo menos uma marca." : "Escolha a marca."; desenhar(); continue;
          }
          it.estado = "rodando"; it.log = ""; desenhar();
          try {
            const q = {arquivo: it.f.name, inicio: it.inicio, fim: it.fim};
            if (it.multi) q.marcas = [...it.escolha].join(",");
            else if (marcaManual) q.marca = marcaManual;   // sem escolha manual, o servidor usa a marca do arquivo
            const r = await api("importar", q, {method: "POST", body: await it.f.arrayBuffer(), headers: {"Content-Type": "text/csv"}});
            it.log = r.log.join("\n").trim();
            it.estado = r.marca || /Já importado|já importado/.test(it.log) ? "ok" : "erro";
            for (const mm of r.marcas || (r.marca ? [r.marca] : [])) marcas = [...new Set([...marcas.filter(x => compacta(x) !== compacta(mm)), mm])].sort();
            if (r.marca) ultima = (r.marcas || []).length > 1 ? "" : r.marca;
          } catch (e) { it.log = e.message; it.estado = "erro"; }
          desenhar();
        }
        rodando = false; terminou = true;
        const ok = itens.filter(it => it.estado === "ok").length;
        $("#up-status", m).textContent = `${ok} de ${itens.length} arquivo(s) importado(s).`;
        desenhar();
        await carregarPainel(); moldura();
        if (ultima && ultima !== S.marca) irPara(ultima); else if (itens.some(it => it.multi) && location.hash.length > 2) irPara(""); else await rotear();
      };
    });
}

async function baixarExcel() {
  toast("Gerando o Excel…", 2500);
  try {
    const blob = await api("excel", S.marca ? {marca: S.marca} : {}, {blob: true});
    if (!(blob instanceof Blob)) throw new Error("Falha ao gerar o Excel.");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = S.marca ? S.marca.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-") + "-explorador-de-anuncios.xlsx" : "painel-geral.xlsx";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { toast(e.message); }
}

// ---------- Modal ----------
function modal(html, init) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="card modal">${html}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if (e.target === bg || e.target.hasAttribute("data-fechar")) bg.remove(); });
  init && init(bg);
  return bg;
}

// ---------- Início ----------
async function iniciar(sessao) {
  S.sessao = sessao;
  if (!sessao) return telaLogin();
  $("#app").innerHTML = `<div class="nload">${LOGO}<div class="nbarra"></div><div class="nmsg">Carregando</div></div>`;
  try { await carregarPainel(); await carregarRankLista(); await carregarVendLista(); }
  catch (e) {
    S.msgLogin = e.message;
    await sb.auth.signOut();
    return telaLogin();
  }
  secaoDesenhada = null;
  await rotear();
  carregarAgente();
  clearTimeout(S.agenteT); S.agenteT = setTimeout(cicloAgente, 20000);
  clearTimeout(S.coletorT); S.coletorT = setTimeout(cicloColetor, 4000);
  carregarAlertasN();
  verificarVersao();
}
// Versão nova publicada: recarrega sozinho (sem precisar de Cmd+Shift+R). Se houver uma janela aberta
// (importação, produto…), espera ela fechar para não perder nada.
async function verificarVersao() {
  clearTimeout(S.versaoT);
  try {
    const v = (await api("versao")).v;
    if (v && S.versao && v !== S.versao) {
      if (!document.querySelector(".modal-bg")) { toast("Nova versão do nubi: atualizando…", 2000); setTimeout(() => location.reload(), 1500); return; }
    } else if (v && !S.versao) S.versao = v;
  } catch { /* sem rede: tenta de novo depois */ }
  S.versaoT = setTimeout(verificarVersao, 120000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.sessao) verificarVersao(); });
// Número do menu "Alertas de estoque": produtos sem estoque/parados em algum concorrente.
async function carregarAlertasN(r) {
  try { r = r || await api("vend_alertas"); S.alertasN = r.produtos.filter(p => p.sem_estoque > 0).length; desenharMenu();
    const kb = document.querySelector('.in-kpi[href="#/alertas"] b'); if (kb) { kb.textContent = nf0.format(S.alertasN); kb.className = S.alertasN ? "neg" : ""; } } catch { /* sem vendedores ainda */ }
}
// Só troca de marca pelo endereço depois que a tela já está montada (o Supabase também
// mexe no endereço ao apagar o token do link de e-mail).
window.addEventListener("hashchange", () => { if (S.sessao && $("#main")) rotear(); });
// O Supabase avisa o login mais de uma vez (SIGNED_IN, INITIAL_SESSION, renovação do
// token…). A página só reinicia quando muda QUEM está logado, uma vez de cada vez, e
// fora do aviso (chamar o Supabase de dentro dele pode travar).
let usuarioAtual, fila = Promise.resolve();
sb.auth.onAuthStateChange((ev, sessao) => {
  if (sessao) S.sessao = sessao;
  const uid = sessao?.user?.id || null;
  if (uid === usuarioAtual) return;
  usuarioAtual = uid;
  setTimeout(() => { fila = fila.then(() => iniciar(sessao)).catch(e => telaLogin(e.message)); }, 0);
});
</script>
